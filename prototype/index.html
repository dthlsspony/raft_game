<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raft slice</title>
<style>
  html,body{margin:0;height:100%;background:#123a52;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#2e7fc4;box-shadow:0 0 0 2px #2b6d90,0 20px 60px #0006;touch-action:none}
  #hint{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="360" height="640"></canvas></div>
<div id="hint"></div>
<div id="err" style="position:fixed;top:0;left:0;color:#f66;font-size:12px;z-index:9"></div>
<script id="core">
/* ---- pure core: extractable, DOM-free ---- */
var DMAX = 1000;          // world units from horizon to the raft
var BASE_SPEED = 25;      // units per second
var DR_FOOD = 2.6, DR_WATER = 2.0;   // supply drain per second at sea
var RIFT_DMG = 14, RIFT_COST = 5;
var LAND_RANGE = 170;     // how close you can be and still tap to land
var RIFT_KEEPOUT = 140;   // no rift in the landing approach
var RIFT_HIT = 0.30;      // share this much of the rift's lane and it bites
var ISLE_W = 360, ISLE_H = 640;

/* the island is a day budget now, not a field of pickups */
var ACTIONS_PER_DAY = 5;      // actions you get before dark (arrival no
                              // longer gathers, so a resource costs a move
                              // AND a gather: this has to fit both)
var DAY_FOOD = 9, DAY_WATER = 7;  // each night on land eats this

/* the island is a NET now, not a menu of six stops. 10-30 dots are
   scattered over the island and linked into one graph, and what each
   dot holds stays hidden until you stand on it. The watchtower is one
   of them; you cannot see which. Hidden pointers (a ridge vantage)
   only give you a bearing, never a mark. */
var ISLE_MIN_NODES = 10, ISLE_MAX_NODES = 30;
/* island art: the page fills this in once the top-down renders load, so a
   dot can never float in the sea. Empty in the sims -> the built-in shape. */
var ISLE_LANDFNS = {};
var ISLE_KIND = {
  shore:  {label:'SHORE',  col:'#eaf4ff'},
  plain:  {label:'OPEN',   col:'#9fc2d6'},
  forage: {label:'GROVE',  col:'#7fe0a0'},
  water:  {label:'SPRING', col:'#7fc4ff'},
  timber: {label:'ROCKS',  col:'#e0b070'},
  vantage:{label:'RIDGE',  col:'#d6c8ff'},
  tower:  {label:'TOWER',  col:'#ffd34d'}
};
var BEARINGS = ['north','north-east','east','south-east','south','south-west','west','north-west'];

/* sound hook: the DOM half installs a real SFX table; in a headless
   sim or a script-only extract there is none, so every cue no-ops. */
function cue(name, arg){
  try{ if(typeof SFX!=='undefined' && SFX && SFX[name]) SFX[name](arg); }catch(e){}
  return null;
}

function dist2(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

/* minimum spanning tree over the dots: always one connected net */
function islePrim(nodes){
  var n=nodes.length, inT=[], dist=[], from=[], edges=[];
  for(var i=0;i<n;i++){ inT[i]=false; dist[i]=Infinity; from[i]=0; }
  inT[0]=true;
  for(var i2=1;i2<n;i2++) dist[i2]=dist2(nodes[i2].x,nodes[i2].y,nodes[0].x,nodes[0].y);
  for(var k=1;k<n;k++){
    var best=-1, bd=Infinity;
    for(var i3=0;i3<n;i3++){ if(!inT[i3] && dist[i3]<bd){ bd=dist[i3]; best=i3; } }
    if(best<0) break;
    inT[best]=true; edges.push([from[best],best]);
    for(var j=0;j<n;j++){
      if(inT[j]) continue;
      var d=dist2(nodes[j].x,nodes[j].y,nodes[best].x,nodes[best].y);
      if(d<dist[j]){ dist[j]=d; from[j]=best; }
    }
  }
  return edges;
}

/* graph hops from one dot. How the day budget stays honest: the tower
   must be a real walk, not one tap away. */
function isleHops(adj, from){
  var n=adj.length, hops=[], q=[from];
  for(var i=0;i<n;i++) hops[i]=-1;
  hops[from]=0;
  while(q.length){
    var cur=q.shift();
    for(var k=0;k<adj[cur].length;k++){
      var nx=adj[cur][k];
      if(hops[nx]<0){ hops[nx]=hops[cur]+1; q.push(nx); }
    }
  }
  return hops;
}

/* grow one island's net from its seed. Everything below is hidden:
   the dots show, their contents do not. */
/* the built-in island shape: used by the sims, and as the fallback before
   the rendered art has loaded */
function ellipseLand(x,y){ var dx=(x-0.5)/0.44, dy=(y-0.47)/0.45; return dx*dx+dy*dy<=1; }

/* the beach: the lowest land on the island's centre line, so you come
   ashore on ground and never in the water. */
function findBeach(land){
  for(var iy=49; iy>=20; iy--){
    var y=iy/50, best=-1;
    for(var ix=15; ix<=35; ix++){
      var x=ix/50;
      if(!land(x,y)) continue;
      if(best<0 || Math.abs(x-0.5)<Math.abs(best-0.5)) best=x;
    }
    if(best>=0) return {x:best, y:y};
  }
  return {x:0.50, y:0.90};
}

function makeIsleGraph(seed, landFn){
  var land = (typeof landFn==='function') ? landFn : ellipseLand;
  var rnd = rngFactory((seed>>>0)||1);
  var N = ISLE_MIN_NODES + Math.floor(rnd()*(ISLE_MAX_NODES-ISLE_MIN_NODES+1));
  // the default shape keeps its exact old beach, so the sims are untouched
  var beach = (land===ellipseLand) ? {x:0.50, y:0.90} : findBeach(land);
  var nodes = [];
  nodes.push({x:beach.x, y:beach.y, type:'shore', seen:true});
  var tries=0, maxTries=N*300;
  while(nodes.length < N && tries < maxTries){
    tries++;
    var x=0.06+rnd()*0.88, y=0.05+rnd()*0.83;
    if(!land(x,y)) continue;
    if(dist2(x,y,beach.x,beach.y) < 0.011) continue;  // clear of the shore
    var ok=true;
    for(var i=0;i<nodes.length;i++){ if(dist2(x,y,nodes[i].x,nodes[i].y) < 0.0062){ ok=false; break; } }
    if(ok) nodes.push({x:x,y:y,type:'plain',seen:false});
  }
  var n=nodes.length;
  var edges = islePrim(nodes);
  var has=[];
  for(var a0=0;a0<n;a0++) has[a0]=[];
  for(var e=0;e<edges.length;e++){ has[edges[e][0]].push(edges[e][1]); has[edges[e][1]].push(edges[e][0]); }
  // a few extra short links turn the bare tree into something you read as a net
  var LINK = 0.145*0.145;
  for(var a=0;a<n;a++) for(var b=a+1;b<n;b++){
    if(has[a].indexOf(b)>=0) continue;
    if(dist2(nodes[a].x,nodes[a].y,nodes[b].x,nodes[b].y) > LINK) continue;
    if(rnd() < 0.5){ edges.push([a,b]); has[a].push(b); has[b].push(a); }
  }
  var adj=[]; for(var i4=0;i4<n;i4++) adj[i4]=has[i4].slice();
  var hops = isleHops(adj, 0);
  // the tower sits deep, and up the island
  var tower=-1, tscore=-Infinity;
  for(var i5=1;i5<n;i5++){
    if(hops[i5] < 3) continue;
    var sc = hops[i5]*1.0 + (0.5-nodes[i5].y)*2.2 + rnd()*0.7;
    if(sc>tscore){ tscore=sc; tower=i5; }
  }
  if(tower<0){ var far=-1; for(var i6=1;i6<n;i6++){ if(hops[i6]>=2 && (far<0||hops[i6]>hops[far])) far=i6; } tower=far; }
  nodes[tower].type='tower';
  // every dot but the shore and the tower starts a secret
  var rest=[];
  for(var i7=0;i7<n;i7++){ if(i7!==0 && i7!==tower) rest.push(i7); }
  // The beach must be able to feed you. Reserve a grove and a spring on
  // the two dots nearest the shore, so a forced resupply on a small
  // island is a real choice and never a death sentence. Nearest = fewest
  // hops first, then closest to the shore.
  rest.sort((a,b)=>{
    var ha=hops[a]<0?999:hops[a], hb=hops[b]<0?999:hops[b];
    if(ha!==hb) return ha-hb;
    return dist2(nodes[a].x,nodes[a].y,0.5,0.9) - dist2(nodes[b].x,nodes[b].y,0.5,0.9);
  });
  var nearFood = rest[0], nearWater = rest.length>1 ? rest[1] : rest[0];
  // shuffle only the interior, so the rest of the island stays a surprise
  var pool=[];
  for(var i8=0;i8<rest.length;i8++){ if(rest[i8]!==nearFood && rest[i8]!==nearWater) pool.push(rest[i8]); }
  for(var i8b=pool.length-1;i8b>0;i8b--){ var j8=Math.floor(rnd()*(i8b+1)); var tmp=pool[i8b]; pool[i8b]=pool[j8]; pool[j8]=tmp; }
  var types=[];
  var nFor=Math.max(1,Math.round(n*0.20)), nWat=Math.max(1,Math.round(n*0.16));
  var nTim=Math.max(1,Math.round(n*0.14)), nRid=1+(rnd()<0.5?1:0);
  var z;
  for(z=0;z<nFor-1;z++) types.push('forage');
  for(z=0;z<nWat-1;z++) types.push('water');
  for(z=0;z<nTim;z++) types.push('timber');
  for(z=0;z<nRid;z++) types.push('vantage');
  while(types.length<pool.length) types.push('plain');
  for(var i9=0;i9<pool.length;i9++) nodes[pool[i9]].type = types[i9] || 'plain';
  nodes[nearFood].type='forage';
  nodes[nearWater].type='water';
  return {nodes:nodes, edges:edges, adj:adj, hops:hops, tower:tower, n:n};
}

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function rngFactory(seed){
  var s = (seed>>>0) || 1;
  return () => {
    s = (s + 0x9e3779b9)>>>0;
    var t = s;
    t ^= t>>>16; t = Math.imul(t, 0x21f0aaad)>>>0;
    t ^= t>>>15; t = Math.imul(t, 0x735a2d97)>>>0;
    t ^= t>>>15;
    return (t>>>0)/4294967296;
  };
}

/* reach in world units the current supplies allow */
function reachOf(g){
  var worst = Math.max(DR_FOOD, DR_WATER);
  var secs = Math.min(g.food/DR_FOOD, g.water/DR_WATER);
  return BASE_SPEED * secs;
}

/* islands start mostly hidden. A watchtower is what puts one on the
   chart, so the map earns itself instead of being handed over. */
function isleArtCount(){
  /* the art table lives in the DOM layer, so the headless core sim has no
     ART_ORDER. Guard it and fall back to the three original renders. */
  return (typeof ART_ORDER!=='undefined' && ART_ORDER.length) ? ART_ORDER.length : 3;
}
function makeTargets(seed){
  var rnd = rngFactory(seed);
  var t = [];
  // a field of islands, not three. A tower sighting of 1..3 only means
  // something when there is more out there to find.
  var N = 7;
  for(var i=0;i<N;i++){
    var lane;
    if(i===0) lane = (rnd()*2-1)*0.5;          // one sits near the home heading
    else lane = (rnd()*2-1)*0.85;
    var dist = 240 + i*80 + rnd()*70;
    var iseed = Math.floor(rnd()*1e9);
    t.push({lane:lane, dist:dist, seed:iseed, big:false,
            artId:iseed, revealed:false, done:false,
            name:'ISLE '+String.fromCharCode(65+i)});
  }
  var blane = (rnd()*2-1)*0.45;
  var bseed = Math.floor(rnd()*1e9);
  t.push({lane:blane, dist:950, seed:bseed, big:true,
          artId:bseed, revealed:false, done:false, name:'THE BIG LAND'});
  // sort shallow-to-deep so the two nearest are the ones sighted from home
  t.sort((a,b)=> a.dist - b.dist);
  var shown = 0;
  for(var k=0;k<t.length && shown<2;k++){ if(!t[k].big){ t[k].revealed = true; shown++; } }
  return t;
}

function newGame(seed){
  var g = {
    seed:(seed>>>0)||1,
    rnd:rngFactory(seed),
    scene:'chart',
    food:100, water:100, integrity:100, materials:0,
    legs:0, towers:0,
    targets:makeTargets(seed),
    target:-1,
    heading:0, steer:0, dragging:false,
    time:0,
    rifts:[],
    isle:null,
    hitFlash:0,
    msg:'pick a heading',
    ended:false, won:false
  };
  return g;
}

function chooseTarget(g, i){
  if(g.scene!=='chart') return g;
  var t = g.targets[i];
  if(!t || t.done) { g.msg='no such island'; return g; }
  if(!t.revealed) { g.msg='you have not sighted that one yet'; return g; }
  g.target = i;
  try{ if(typeof requestIsland==='function') requestIsland(t.artId, true); }catch(e){}
  g.heading = t.lane;
  g.scene = 'sail';
  g.isle = null;            // a chosen heading abandons the island for good
  g.time = 0;
  planRifts(g, t.dist);
  cue('heading');
  g.msg = 'heading for ' + t.name;
  return g;
}

/* spread a small, fixed handful of rifts across the leg, so they
   arrive DURING the voyage and before the island does. The last
   stretch before land stays clear (RIFT_KEEPOUT), so a rift can
   never park itself in your landing approach. */
function planRifts(g, legDist){
  g.rifts = [];
  var span = legDist - RIFT_KEEPOUT;
  if(span < 100) return g;           // short hop: no crossing
  var n = clamp(Math.round(span/300), 1, 3);
  for(var i=0;i<n;i++){
    var d = span * (i+1)/(n+1);      // strictly inside the span, so gap >= keepout
    g.rifts.push({ lane:(g.rnd()*2-1)*0.9, d:d, age:0 });
  }
  return g;
}

function canLand(g){
  if(g.scene!=='sail') return false;
  var t = g.targets[g.target];
  if(!t) return false;
  return t.dist <= LAND_RANGE && t.dist > -6;
}

/* ---------- the island day loop (text-adventure) ---------- */

function say(g, s){
  if(!g.isle) return g;
  g.isle.log.push(s);
  if(g.isle.log.length > 60) g.isle.log.shift();
  return g;
}

function makeIsle(g, t){
  var gr = makeIsleGraph(t.seed, ISLE_LANDFNS[t.artId]);
  g.isle = {
    name: t.name,
    artId: t.artId,
    day: 1,
    actions: ACTIONS_PER_DAY,
    at: 0,
    tower: false,
    hint: null,
    graph: gr,
    log: []
  };
  say(g, 'You come ashore at ' + t.name + '.');
  say(g, 'Day 1. ' + ACTIONS_PER_DAY + ' actions before dark.');
  say(g, gr.n + ' places on this island, all linked. The rest are unknown.');
  return g;
}

/* a found tower reveals one to three new islands. If every ordinary
   island is already on the chart, the last tower reveals the big land. */
function revealFromTower(g){
  var i, out = [];
  var normal = [], bigIdx = -1;
  for(i=0;i<g.targets.length;i++){
    var t = g.targets[i];
    if(t.done || t.revealed) continue;
    if(t.big){ bigIdx = i; continue; }
    normal.push(i);
  }
  if(normal.length){
    for(i=normal.length-1;i>0;i--){
      var j = Math.floor(g.rnd()*(i+1));
      var tmp = normal[i]; normal[i] = normal[j]; normal[j] = tmp;
    }
    var n = Math.min(normal.length, 1 + Math.floor(g.rnd()*3));
    for(i=0;i<n;i++){ g.targets[normal[i]].revealed = true; out.push(g.targets[normal[i]].name); }
  } else if(bigIdx>=0 && !g.targets[bigIdx].revealed){
    g.targets[bigIdx].revealed = true;
    out.push(g.targets[bigIdx].name);
  }
  try{ if(typeof requestIsland==='function'){ for(i=0;i<g.targets.length;i++){ var tt=g.targets[i]; if(tt.revealed) requestIsland(tt.artId); } } }catch(e){}
  return out;
}

/* a bearing word from a vantage toward the tower. y grows downward,
   so north is up. It is a direction, never a mark. */
function bearingWord(dx, dy){
  var k = Math.round(Math.atan2(dx, -dy)/(Math.PI/4));
  k = ((k%8)+8)%8;
  return BEARINGS[k];
}

/* arriving somewhere runs what is there. Walking onto a resource dot
   only reveals it; GATHER is the one action that collects. Standing
   still is free, so tapping the dot under you costs nothing. */
function runNode(g, idx){
  var is = g.isle, gr = is.graph, node = gr.nodes[idx];
  node.seen = true;
  var kind = node.type;
  if(kind==='forage'){
    say(g, 'A grove, unmarked until you pushed in. Stand and GATHER.');
  } else if(kind==='water'){
    say(g, 'A spring under the ferns. Stand and GATHER.');
  } else if(kind==='timber'){
    say(g, 'Broken rock and deadfall. Stand and GATHER.');
  } else if(kind==='vantage'){
    if(is.tower){
      say(g, 'From the ridge the sighted chart reads plain.');
    } else {
      var tn = gr.nodes[gr.tower];
      var bearing = bearingWord(tn.x - node.x, tn.y - node.y);
      is.hint = {from: idx, b: bearing};
      say(g, 'From the ridge the canopy thins. A watchtower outline, somewhere to the ' + bearing + '.');
    }
  } else if(kind==='tower'){
    if(!is.tower){
      is.tower = true;
      g.towers++;
      say(g, 'You push out of the brush onto bare ground: a watchtower, still standing. You climb it.');
      var seen = revealFromTower(g);
      if(seen.length) say(g, 'From the top you sight ' + seen.length + ' new island' + (seen.length>1?'s':'') + ': ' + seen.join(', ') + '.');
      else say(g, 'The horizon shows nothing you cannot already see.');
    } else {
      say(g, 'You climb the tower again. The horizon is the same.');
    }
  } else if(kind==='shore'){
    say(g, 'The raft waits in the shallows.');
  } else {
    var flavor = ['Open ground. Wind and grass.', 'Nothing here but birdsong.',
                  'A clearing. The canopy is quiet.', 'Bare stone, no water, no shade.'];
    say(g, flavor[Math.floor(g.rnd()*flavor.length)]);
  }
  return g;
}

/* one action, one move. Tapping the dot you are already standing on
   is not a move: it costs nothing, so nobody loses a point by poking
   the ground under their feet. */
function moveTo(g, idx){
  if(g.scene!=='island' || !g.isle) return g;
  var is = g.isle, gr = is.graph;
  if(typeof idx!=='number' || idx<0 || idx>=gr.n){ say(g, 'There is nowhere called that.'); return g; }
  if(idx===is.at){ say(g, 'You are already standing here. GATHER works this spot.'); return g; }
  if(is.actions<=0){ say(g, 'No actions left today. Make camp.'); return g; }
  if(gr.adj[is.at].indexOf(idx)<0){ say(g, 'No path from here to that one.'); return g; }
  is.actions--;
  is.at = idx;
  cue('step');
  return runNode(g, idx);
}

/* the explicit gather: one action for whatever the dot under you holds. */
function doGather(g, kind){
  var is = g.isle, node = is.graph.nodes[is.at];
  node.seen = true;
  if(kind==='forage'){
    var f = 10 + Math.floor(g.rnd()*7), w = 4 + Math.floor(g.rnd()*5);
    g.food = Math.min(200, g.food + f);
    g.water = Math.min(200, g.water + w);
    say(g, 'You work the grove. food +' + f + ', water +' + w + '.');
  } else if(kind==='water'){
    var w2 = 10 + Math.floor(g.rnd()*7), f2 = 2 + Math.floor(g.rnd()*4);
    g.water = Math.min(200, g.water + w2);
    g.food = Math.min(200, g.food + f2);
    say(g, 'You fill up at the spring. water +' + w2 + ', food +' + f2 + '.');
  } else if(kind==='timber'){
    var m = 2 + Math.floor(g.rnd()*3);
    g.materials += m;
    say(g, 'You break off rock and deadfall. materials +' + m + '.');
  }
  cue('gather', kind);
  return g;
}

/* stand and gather: the only way a resource dot pays. Arriving on one
   just reveals it, so finding a spot and working it are two acts. */
function gatherHere(g){
  if(g.scene!=='island' || !g.isle) return g;
  var is = g.isle, node = is.graph.nodes[is.at];
  var kind = node ? node.type : '';
  if(kind!=='forage' && kind!=='water' && kind!=='timber'){
    say(g, 'Nothing to gather here. Walk to a grove, a spring or the rocks.');
    return g;
  }
  if(is.actions<=0){ say(g, 'No actions left today. Make camp.'); return g; }
  is.actions--;
  return doGather(g, kind);
}

/* Leaving is one tap. SET SAIL drops you on the chart to pick a heading,
   and the chart offers BACK ASHORE, so you can return and gather before
   you commit. No second tap on the island button itself. */
function setSail(g){
  if(g.scene!=='island' || !g.isle) return g;
  return leaveIsland(g);
}

function endDay(g){
  if(!g.isle) return g;
  g.food  = Math.max(0, g.food  - DAY_FOOD);
  g.water = Math.max(0, g.water - DAY_WATER);
  say(g, 'Night falls. You eat and drink. food ' + Math.round(g.food) + ', water ' + Math.round(g.water) + '.');
  if(g.food<=0 || g.water<=0){
    say(g, 'Nothing left to eat or drink. You will not last here.');
    g.scene = 'over'; g.ended = true; g.msg = 'stranded on ' + g.isle.name;
    cue('lose');
    return g;
  }
  g.isle.day++;
  g.isle.actions = ACTIONS_PER_DAY;
  say(g, 'Day ' + g.isle.day + '. ' + ACTIONS_PER_DAY + ' actions.');
  cue('night');
  return g;
}

/* no dead ends: if the chart holds nothing reachable, the big land
   was always out there, it just was never sighted. */
function ensureDestinations(g){
  var any = false, bi = -1;
  for(var i=0;i<g.targets.length;i++){
    var t = g.targets[i];
    if(t.done) continue;
    if(t.big) bi = i;
    else if(t.revealed) any = true;
  }
  if(!any && bi>=0 && !g.targets[bi].revealed) g.targets[bi].revealed = true;
  return g;
}

function doLandfall(g){
  if(g.scene!=='sail') return g;
  var t = g.targets[g.target];
  if(!t){ backToChart(g); return g; }
  t.done = true;
  g.legs++;
  if(t.big){
    g.scene='win'; g.won=true; g.ended=true;
    g.msg='you reached the big land';
    cue('win');
    return g;
  }
  cue('land');
  makeIsle(g, t);
  g.scene = 'island';
  g.msg = 'ashore at ' + t.name;
  return g;
}

function backToChart(g){
  g.scene='chart';
  g.target=-1;
  g.rifts=[];
  g.isle=null;
  ensureDestinations(g);
  return g;
}

function leaveIsland(g){
  if(g.scene!=='island') return g;
  g.scene='chart';
  g.target=-1;
  g.rifts=[];
  ensureDestinations(g);
  g.msg='pick a heading, or go back ashore';
  cue('sail');
  return g;
}

/* back onto the island you just left, before committing to a leg */
function returnToIsland(g){
  if(g.scene!=='chart' || !g.isle) return g;
  g.scene='island';
  g.msg='ashore at ' + g.isle.name;
  return g;
}

/* ---------- sailing ---------- */

function tickSail(g, dt){
  if(g.scene!=='sail' || g.ended) return g;
  var t = g.targets[g.target];
  if(!t){ backToChart(g); return g; }

  if(g.steer) g.heading = clamp(g.heading + g.steer*1.15*dt, -1, 1);
  else if(!g.dragging) g.heading = g.heading * Math.max(0, 1 - 0.9*dt);

  g.food  = Math.max(0, g.food  - DR_FOOD*dt);
  g.water = Math.max(0, g.water - DR_WATER*dt);
  if(g.food<=0 || g.water<=0){
    g.scene='over'; g.ended=true; g.msg='out of food and water on the open sea';
    cue('lose');
    return g;
  }

  t.dist -= BASE_SPEED*dt;

  g.time += dt;
  for(var i=g.rifts.length-1;i>=0;i--){
    var rf=g.rifts[i];
    rf.age = (rf.age||0) + dt;
    rf.d -= (BASE_SPEED+7)*dt;
    if(rf.d < -8){ g.rifts.splice(i,1); continue; }
    if(rf.d < 12 && rf.d > -2 && Math.abs(rf.lane - g.heading) < RIFT_HIT){
      g.integrity = clamp(g.integrity - RIFT_DMG, 0, 100);
      g.food = Math.max(0, g.food - RIFT_COST*0.5);
      g.water = Math.max(0, g.water - RIFT_COST*0.5);
      g.hitFlash = 0.35;
      g.msg = 'rift. raft ' + Math.round(g.integrity);
      g.rifts.splice(i,1);
      if(g.integrity<=0){ g.scene='over'; g.ended=true; g.msg='the raft broke apart on a rift'; cue('lose'); return g; }
    }
  }
  if(g.hitFlash>0) g.hitFlash = Math.max(0, g.hitFlash-dt);

  if(t.dist <= 8) return doLandfall(g);
  return g;
}

function tickChart(g, dt){
  if(g.scene==='chart' || g.scene==='island'){ g.time += dt; }
  return g;
}

(()=>{
  const { Perlin, mulberry32 } = GEN;

// «Зубцы» — только на склонах: гладкая шапка не мерцает снегом/скалами.

  }

function generateHeightmap(opts) {
  const {
    width: W, height: H, seed = 1, mode = 'volcanic', seaLevel = 0.35,
    mountains = {}, coast = {},
  } = opts;

  const {
    peak = 1.0,
    scale = 3.0,
    octaves = 6,
    roughness = 1.0,
    ridged = true,
    caldera = 0.25,
    ridgeWidth = 0.26,
    elongation = 0.65,
    peaks = 0,       // 0 = автоматически (2..4)
    hills = 1.0,     // холмистость низин
  } = mountains;

  const { radius = 0.92, irregularity = 0.17 } = coast;

  const rng = mulberry32(((seed * 7919 + 13) >>> 0) || 1);
  const coastN = new Perlin(seed + 11);
  const warpN = new Perlin(seed + 137);
  const baseN = new Perlin(seed + 257);
  const hillN = new Perlin(seed + 733);
  const detailN = new Perlin(seed + 991);

  // Посевные вариации параметров — островы отличаются при одном профиле.

  const elongV = 0.55 + elongation * (0.3 + rng() * 0.9);
  const hillAmp = clampR(hills * (0.7 + rng() * 0.6), 0, 2.5);

  // Анти-алиасинг: верхняя октава не должна превышать ~2 пикселя на период,

      cald: calderaV, jag: true,

        ox: (rng() - 0.5) * 0.3, oy: (rng() - 0.5) * 0.3,

        w: ridgeWV * (0.8 + rng() * 0.5),

        off: rng() * 100,
      });

    for (let i = 0; i < extra; i++) {
      const [qx, qy] = place(0.55);
      cones.push({
        x: qx, y: qy, r: 0.09 + rng() * 0.1,
        h: 0.32 + rng() * 0.38,
        exp: 1.7 + rng() * 0.8,
        cald: 0, jag: false,
      });
    }
  } else if (mode === 'continental') {
    for (let i = 0; i < nPeaks + 1; i++) {
      const [qx, qy] = place(0.55);

        x: qx, y: qy, r: 0.2 + rng() * 0.22,
        h: (i === 0 ? 0.62 + rng() * 0.26 : 0.36 + rng() * 0.4),
        exp: 2.0 + rng() * 0.6,
        cald: 0, jag: false,
      });
    }

    const nIsl = 3 + Math.floor(rng() * 4);
    for (let i = 0; i < nIsl; i++) {
      const a = (i / nIsl) * Math.PI * 2 + rng() * 0.5;
      cones.push({
        x: Math.cos(a) * 0.66, y: Math.sin(a) * 0.66,
        r: 0.05 + rng() * 0.07, h: 0.4 + rng() * 0.3,
        exp: 2.0, cald: 0, jag: false,
      });

    const nSat = Math.floor(rng() * 3);
    for (let i = 0; i < nSat; i++) {
      const a = rng() * Math.PI * 2;
      const rr = 0.95 + rng() * 0.18;
      cones.push({
        x: Math.cos(a) * rr, y: Math.sin(a) * rr,
        r: 0.04 + rng() * 0.05, h: 0.16 + rng() * 0.24,
        exp: 1.9, cald: 0, jag: false,

      // Поля вершин и хребтов (максимум по всем — без аддитивного «заплывания»).
      let highland = 0;
      for (let ci = 0; ci < cones.length; ci++) {
        const c = cones[ci];
        const dx = (qx - c.x) / c.r, dy = (qy - c.y) / c.r;
        const hh = coneHeight(dx, dy, c, jagN) * peak;
        if (hh > highland) highland = hh;

        const ru = (qx - R.ox) * Math.cos(R.a) + (qy - R.oy) * Math.sin(R.a);
        const rv = -(qx - R.ox) * Math.sin(R.a) + (qy - R.oy) * Math.cos(R.a);
        const w = R.w * (0.75 + 0.5 * (coastN.fbm(ru * 2 + R.off, 3.3, 3) * 0.5 + 0.5));

      let h;
      let hillAdd = 0;
      if (mode === 'atoll') {
        // Низкое кольцо + лагуна ниже уровня моря.
        const ring = (0.40 + 0.18 * base) * mask + highland;
        const lagoonH = seaLevel - 0.09 + 0.05 * base;
        h = lerp(lagoonH, ring, smoothstep(0.42, 0.66, r01));
      } else {
        // Низины ~0.30..0.58, вершины продавливают базу вверх.
        // У тектоники база ниже: ridged-шум сам по себе высокий,
        // иначе хребтовое «подолье» целиком уходит в снег.
        const lowland = mode === 'tectonic'
          ? 0.30 + 0.24 * base
          : 0.34 + 0.28 * base;
        let e = lowland * (1 - 0.85 * highland) + highland;

        // Холмистость именно в зелёной зоне (гасится на склонах вершин).
        const hillV = hillN.fbm(nx * 6.5 + hillOff, ny * 6.5 + hillOff * 0.37, 3) * 0.5 + 0.5;
        const lowW = (1 - smoothstep(0.55, 0.82, e)) * mask;
        hillAdd = (hillV - 0.5) * 0.30 * hillAmp * lowW;

        h = e * Math.pow(mask, 1.35);
      }

      // плавный (не обрывистый) подъём зелени от берега.
      const dsea = h - seaLevel;
      const ad = dsea < 0 ? -dsea : dsea;
      if (ad < 0.2) {
        h = seaLevel + dsea * (0.45 + 0.55 * smoothstep(0, 0.2, ad));
      }

      // Холмы добавляем после растяжки — иначе пляжевая компрессия
      // их гасит и зелень становится плоской.
      if (hillAdd !== 0 && h > seaLevel + 0.006) {

      }

    }

  // вместо одной, вытянутой в одиночный «пик» максимумом.

  const stride = Math.max(1, (map.length / 4096) | 0);

  for (let i = 0; i < map.length; i += stride) if (map[i] > seaLevel) vals.push(map[i]);
  let norm = 0;
  if (vals.length > 16) {
    vals.sort((a, b) => a - b);
    norm = vals[((vals.length - 1) * 0.99) | 0];

    for (let i = 0; i < map.length; i++) {
      let v = map[i] / norm;
      if (v > 0.97) v = 0.97 + (v - 0.97) * 0.45;
      map[i] = v > 1 ? 1 : v;
    }
  }
  return map;
}

function sampleHG(map, W, x, y, out) {

  const fx = x - x0, fy = y - y0;
  const i00 = y0 * W + x0;

        const lapY = at(cur, x, y - 1) + at(cur, x, y + 1) - 2 * h;

          const nh = src[i + ddy[k] * W + ddx[k]];
          const e = h - nh - talus * dd[k];
          exc[k] = e > 0 ? e : 0;

  }
  map.set(src);
  for (let i = 0; i < map.length; i++) map[i] = clamp01(map[i]);
  return map;

// Priority-flood заливка понижений: уровни озёр и глубины океана.
class MinHeap {
  constructor(cap) {
    this.k = new Float64Array(cap + 1);
    this.v = new Int32Array(cap + 1);
    this.n = 0;
    this.topKey = 0;
  }

  push(key, val) {
    const k = this.k, v = this.v;
    let i = ++this.n;
    k[i] = key; v[i] = val;
    while (i > 1) {
      const p = i >> 1;
      if (k[p] <= k[i]) break;
      const tk = k[p]; k[p] = k[i]; k[i] = tk;
      const tv = v[p]; v[p] = v[i]; v[i] = tv;
      i = p;
    }
  }

  // Возвращает индекс ячейки; ключ лежит в this.topKey (без аллокаций).
  popMin() {
    const k = this.k, v = this.v;
    this.topKey = k[1];
    const val = v[1];
    const n = --this.n;
    if (n > 0) {
      k[1] = k[n + 1]; v[1] = v[n + 1];
      let i = 1;
      for (;;) {
        const l = i << 1, r = l + 1;
        let s = i;
        if (l <= n && k[l] < k[s]) s = l;
        if (r <= n && k[r] < k[s]) s = r;
        if (s === i) break;
        const tk = k[s]; k[s] = k[i]; k[i] = tk;
        const tv = v[s]; v[s] = v[i]; v[i] = tv;
        i = s;
      }
    }
    return val;
  }
}

function computeWater(height, W, H, seaLevel) {
  const N = W * H;
  const filled = new Float32Array(N);
  const visited = new Uint8Array(N);
  // Каждая ячейка попадает в кучу не более одного раза.
  const heap = new MinHeap(N);

  const seed = (i, level) => {
    if (visited[i]) return;
    visited[i] = 1;
    filled[i] = level;
    heap.push(level, i);
  };

  for (let x = 0; x < W; x++) {
    seed(x, Math.max(height[x], seaLevel));
    seed((H - 1) * W + x, Math.max(height[(H - 1) * W + x], seaLevel));
  }
  for (let y = 0; y < H; y++) {
    seed(y * W, Math.max(height[y * W], seaLevel));
    seed(y * W + W - 1, Math.max(height[y * W + W - 1], seaLevel));
  }
  for (let i = 0; i < N; i++) {
    if (height[i] <= seaLevel) seed(i, seaLevel);
  }

  while (heap.n > 0) {
    const i = heap.popMin();
    const key = heap.topKey;
    const x = i % W, y = (i / W) | 0;
    if (x > 0) {
      const ni = i - 1;
      if (!visited[ni]) { visited[ni] = 1; const lvl = Math.max(height[ni], key); filled[ni] = lvl; heap.push(lvl, ni); }
    }
    if (x < W - 1) {
      const ni = i + 1;
      if (!visited[ni]) { visited[ni] = 1; const lvl = Math.max(height[ni], key); filled[ni] = lvl; heap.push(lvl, ni); }
    }
    if (y > 0) {
      const ni = i - W;
      if (!visited[ni]) { visited[ni] = 1; const lvl = Math.max(height[ni], key); filled[ni] = lvl; heap.push(lvl, ni); }
    }
    if (y < H - 1) {
      const ni = i + W;
      if (!visited[ni]) { visited[ni] = 1; const lvl = Math.max(height[ni], key); filled[ni] = lvl; heap.push(lvl, ni); }
    }
  }

  const water = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const d = filled[i] - height[i];
    water[i] = d > 0 ? d : 0;
  }
  return { water, filled };
}

(()=>{
  const { Perlin } = GEN;
  const { smoothField, boxBlurField } = GEN;

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0));

// ---------------------------------------------------------------- биомы

const BIOME = {
  OCEAN_DEEP: 0,
  OCEAN_SHALLOW: 1,
  LAKE: 2,
  BEACH: 3,
  PLAIN: 4,
  FOREST: 5,
  MARSH: 6,
  HILL: 7,
  ROCK: 8,
  SNOW: 9,
  CLIFF: 10,
};

const BIOME_LABELS = {
  [BIOME.OCEAN_DEEP]: 'глубокий океан',
  [BIOME.OCEAN_SHALLOW]: 'мелководье',
  [BIOME.LAKE]: 'озеро',
  [BIOME.BEACH]: 'пляж',
  [BIOME.PLAIN]: 'равнина',
  [BIOME.FOREST]: 'лес',
  [BIOME.MARSH]: 'болото',
  [BIOME.HILL]: 'холмы',
  [BIOME.ROCK]: 'скалы',
  [BIOME.SNOW]: 'снежная шапка',
  [BIOME.CLIFF]: 'обрыв',
};

/**
 * 99-й перцентиль высоты суши: опорная точка для относительных биомных линий.
 * Одиночный пик не должен задавать всю шкалу.
 */
function landP99(height, W, H, seaLevel) {
  const land = [];
  for (let i = 0; i < W * H; i++) if (height[i] > seaLevel) land.push(height[i]);
  if (!land.length) return seaLevel + 0.5;
  land.sort((a, b) => a - b);
  return land[Math.min(land.length - 1, Math.floor(land.length * 0.99))];
}

/**
 * Классификация биомов: используется и раскраской, и картой проходимости,
 * поэтому «белые шапки», серые скалы и болота на обоих картах совпадают.
 */
function classifyTerrain(height, water, W, H, opts = {}) {  const {
    seaLevel = 0.35,
    snowLine = 0.84,
    rockLine = 0.68,
    beachWidth = 0.028,
    cliffSlope = 0.08,
    rockSlope = 0.038,
    hillRelief = 0.03,
    marshLevel = 0.06,
    marshSlope = 0.014,
    marshNoise = 0.12,
    lakeDepth = 0.004,
    wetDepth = 0.0005,
    biomeSeed = 9127,
  } = opts;

  // Полоса зелени (плоскогорье..лес..холмы) измеряется не абсолютной высотой,
  // а долей от диапазона суши, иначе одна и та же rockLine на разном рельефе
  // даёт то «зелёную стену», то голый камень.
  const landMax = landP99(height, W, H, seaLevel);
  const greenTop = Math.max(seaLevel + 1e-4, Math.min(rockLine, landMax));
  const greenSpan = Math.max(1e-6, greenTop - seaLevel);

  const biome = new Uint8Array(W * H);
  // Широкий базис: холмы — это волны ~20..80 px, мелкий блюр их не видит.
  const broad = boxBlurField(height, W, H, 24);
  // Снеговую линию сравниваем со сглаженной высотой: зубцы рельефа
  // вокруг порога иначе мерцают серыми пятнами РОК прямо на шапке.
  const snowH = boxBlurField(height, W, H, 5);
  const pn = new Perlin(biomeSeed);

  const refScale = W / 512; // пороги уклона не зависят от разрешения

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const h = height[i];
      const w = water[i];

      if (h <= seaLevel + 1e-4) {
        biome[i] = (seaLevel - h) > 0.10 ? BIOME.OCEAN_DEEP : BIOME.OCEAN_SHALLOW;
        continue;
      }
      // Озёра и болота — только низина: заполненная водой впадина высоко на
      // склоне не должна становиться болотом (иначе «болото» лезет на вершину).
      if (w > lakeDepth && h < seaLevel + 0.35 * (landMax - seaLevel)) { biome[i] = BIOME.LAKE; continue; }
      if (w > wetDepth && h < seaLevel + marshLevel * 1.8) { biome[i] = BIOME.MARSH; continue; } // переувлажнённая кромка

      const xm = x > 0 ? x - 1 : 0, xp = x < W - 1 ? x + 1 : W - 1;
      const ym = y > 0 ? y - 1 : 0, yp = y < H - 1 ? y + 1 : H - 1;
      const sx = (height[y * W + xp] - height[y * W + xm]) * 0.5 * refScale;
      const sy = (height[yp * W + x] - height[ym * W + x]) * 0.5 * refScale;
      const slope = Math.sqrt(sx * sx + sy * sy);
      const relief = Math.abs(h - broad[i]);

      let b;
      if (snowH[i] >= snowLine) b = BIOME.SNOW;
      else if (slope >= cliffSlope) b = BIOME.CLIFF;
      else if (h >= rockLine || slope >= rockSlope) b = BIOME.ROCK;
      else if (h <= seaLevel + beachWidth) b = BIOME.BEACH;
      else if (
        h < seaLevel + marshLevel && slope < marshSlope &&
        pn.fbm(x * 0.045 + 137.3, y * 0.045, 3) > marshNoise
      ) b = BIOME.MARSH;
      else {
        // Зелень бэндится по высоте: низина — равнина/болото, середина — лес,
        // верх зелёной полосы — холмы с бурым оттенком. Плюс локальный рельеф.
        const relG = (h - seaLevel) / greenSpan; // 0 = берег, 1 = верх зелени
        if (relG > 0.64 || relief > hillRelief * 1.5) b = BIOME.HILL;
        else if (relG > 0.30) b = BIOME.FOREST;
        else b = pn.fbm(x * 0.02 + 77.7, y * 0.02, 3) > 0.08 ? BIOME.FOREST : BIOME.PLAIN;
      }

      biome[i] = b;
    }
  }

  // Мажоритарный фильтр 3×3: убирает «мерцание» биомов
  // (снег/скалы на шапке, болото/лес пятнами по одному пикселю).
  const counts = new Int32Array(16);
  const filtered = Uint8Array.from(biome);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      counts.fill(0);
      for (let dy = -1; dy <= 1; dy++) {
        const r = (y + dy) * W + x;
        for (let dx = -1; dx <= 1; dx++) counts[biome[r + dx]]++;
      }
      let best = biome[i], bestN = 0;
      for (let bId = 0; bId < 16; bId++) {
        if (counts[bId] > bestN) { bestN = counts[bId]; best = bId; }
      }
      if (bestN >= 6) filtered[i] = best;
    }
  }
  // Убираем одиночные «соль/перец» пиксели: если пиксель не совпадает ни с
  // одним из 8 соседей, берём самый частый соседний биом.
  const lone = Uint8Array.from(filtered);
  const ncounts = new Int32Array(16);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const b = filtered[i];
      let isolated = true;
      ncounts.fill(0);
      for (let dy = -1; dy <= 1; dy++) {
        const r = (y + dy) * W + x;
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nb = filtered[r + dx];
          if (nb === b) isolated = false;
          ncounts[nb]++;
        }
      }
      if (isolated) {
        let bb = b, bn = 0;
        for (let bId = 0; bId < 16; bId++) { if (ncounts[bId] > bn) { bn = ncounts[bId]; bb = bId; } }
        lone[i] = bb;
      }
    }
  }
  return lone;
}

/**
 * Базовый цвет суши по биому и высоте (без освещения) — общий для видов сверху
 * и сбоку, чтобы шапки/скалы/болота выглядели одинаково на всех рендерах.
 */
function terrainColor(b, h, seaLevel, rockLine, snowLine, out) {
  const o = out || tmpColor;
  switch (b) {
    case BIOME.BEACH: {
      const k = clamp01((h - seaLevel) / 0.03);
      o[0] = lerp(230, 208, k); o[1] = lerp(216, 210, k); o[2] = lerp(176, 170, k);
      break;
    }
    case BIOME.MARSH: {
      const k = 1 - clamp01((h - seaLevel) / 0.075);
      o[0] = lerp(108, 72, k); o[1] = lerp(128, 102, k); o[2] = lerp(92, 84, k);
      break;
    }
    case BIOME.ROCK: {
      const c = samplePalette(ROCK_PALETTE, (h - rockLine) / Math.max(1e-6, snowLine - rockLine), o);
      o[0] = c[0]; o[1] = c[1]; o[2] = c[2];
      break;
    }
    case BIOME.CLIFF: {
      o[0] = 98; o[1] = 94; o[2] = 88;
      break;
    }
    case BIOME.SNOW: {
      const k = clamp01((h - snowLine) / Math.max(1e-6, 1 - snowLine));
      o[0] = lerp(224, 252, k); o[1] = lerp(227, 253, k); o[2] = lerp(233, 255, k);
      break;
    }
    default: {
      // PLAIN / FOREST / HILL — зелёная зона до скальной линии.
      const t = clamp01((h - seaLevel) / Math.max(1e-6, rockLine - seaLevel));
      const c = samplePalette(GRASS_PALETTE, t, o);
      if (b === BIOME.FOREST) {
        o[0] = c[0] * 0.8; o[1] = c[1] * 0.92; o[2] = c[2] * 0.8;
      } else if (b === BIOME.HILL) {
        o[0] = lerp(c[0], 112, 0.25);
        o[1] = lerp(c[1], 148, 0.25);
        o[2] = lerp(c[2], 78, 0.25);
      } else {
        o[0] = c[0]; o[1] = c[1]; o[2] = c[2];
      }
      break;
    }
  }
  return o;
}

// ---------------------------------------------------------------- вид сверху

function renderTopDown(height, water, biome, W, H, opts = {}) {
  const {
    seaLevel = 0.35,
    rockLine = 0.60,
    snowLine = 0.78,
    waterPalette = DEFAULT_WATER_PALETTE,
    light = [-0.62, -0.72, 0.34],
    shadeStrength = 1.0,
    shadeAmount = 0.72,
  } = opts;

  const rgba = new Uint8Array(W * H * 4);
  const g = smoothField(height, W, H); // градиенты по сглаженному полю — без «перца»

  const ll = Math.sqrt(light[0] * light[0] + light[1] * light[1] + light[2] * light[2]) || 1;
  const lx = light[0] / ll, ly = light[1] / ll, lz = light[2] / ll;

  let maxDepth = 1e-6;
  for (let i = 0; i < water.length; i++) if (water[i] > maxDepth) maxDepth = water[i];
  const depthScale = Math.max(0.05, maxDepth * 0.30);

  const ambient = 1 - shadeAmount;
  // Альбедо биомов: снег/пляж отражают сильнее, чем трава, — иначе
  // «белые шапки» рендерятся серыми и глухими.
  const AMB_LIFT = new Float32Array(11);
  AMB_LIFT[BIOME.BEACH] = 0.18;
  AMB_LIFT[BIOME.ROCK] = 0.12;
  AMB_LIFT[BIOME.SNOW] = 0.34;
  const tanhK = W * 0.0011 * shadeStrength;
  const col = [0, 0, 0];

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const b = biome[i];
      let r, gg, bb;

      if (b <= BIOME.LAKE) {
        const w = water[i];
        if (b === BIOME.LAKE) {
          const t = Math.min(1, w / 0.06);
          r = lerp(96, 44, t); gg = lerp(166, 106, t); bb = lerp(154, 118, t);
        } else {
          const c = samplePalette(waterPalette, Math.min(1, w / depthScale));
          r = c[0]; gg = c[1]; bb = c[2];
        }
        // Прибрежная пена — светлая кромка на мелководье.
        if (w > 1e-5 && w < 0.0035) {
          const f = Math.pow(1 - w / 0.0035, 1.6) * 0.5;
          r = lerp(r, 235, f); gg = lerp(gg, 244, f); bb = lerp(bb, 248, f);
        }
      } else {
        terrainColor(b, height[i], seaLevel, rockLine, snowLine, col);

        const xm = x > 0 ? x - 1 : 0, xp = x < W - 1 ? x + 1 : W - 1;
        const ym = y > 0 ? y - 1 : 0, yp = y < H - 1 ? y + 1 : H - 1;
        const gx = (g[y * W + xp] - g[y * W + xm]) * 0.5;
        const gy = (g[yp * W + x] - g[ym * W + x]) * 0.5;

        // tanh ограничивает контраст: круто, но без выжигания на гребнях.
        // Снег рассеивает свет — затеняем его мягче.
        const k = tanhK * (b === BIOME.SNOW ? 0.5 : (b === BIOME.ROCK ? 0.85 : 1));
        const zx = Math.tanh(gx * k) * 2.2;
        const zy = Math.tanh(gy * k) * 2.2;
        const nl = Math.sqrt(zx * zx + zy * zy + 1);
        const dot = clamp01((-zx * lx - zy * ly + lz) / nl);
        let shade = ambient + AMB_LIFT[b] + shadeAmount * (0.35 + 0.85 * dot);

        // Крутые склоны слегка темнее — добавляет ощущение глубины.
        const m = Math.sqrt(zx * zx + zy * zy);
        if (m > 0.9) shade *= 1 - 0.22 * Math.min(1, m - 0.9);

        r = col[0] * shade; gg = col[1] * shade; bb = col[2] * shade;
      }

      const o = i * 4;
      rgba[o] = r < 0 ? 0 : r > 255 ? 255 : r | 0;
      rgba[o + 1] = gg < 0 ? 0 : gg > 255 ? 255 : gg | 0;
      rgba[o + 2] = bb < 0 ? 0 : bb > 255 ? 255 : bb | 0;
      rgba[o + 3] = 255;
    }
  }
  return rgba;
}

// ---------------------------------------------------------------- виды сбоку

function makeSideSampler(field, W, H, dir) {
  switch (dir) {
    case 'N': return { SW: W, L: H, sample: (sx, k) => field[(H - 1 - k) * W + sx] };
    case 'S': return { SW: W, L: H, sample: (sx, k) => field[k * W + sx] };
    case 'W': return { SW: H, L: W, sample: (sx, k) => field[sx * W + (W - 1 - k)] };
    case 'E': return { SW: H, L: W, sample: (sx, k) => field[sx * W + k] };
    default: throw new Error('bad dir ' + dir);
  }
}

function renderSideView(height, biome, W, H, dir, opts = {}) {
  const {
    SH = 260,
    seaLevel = 0.35,
    rockLine = 0.60,
    snowLine = 0.78,
    skyTop = [98, 152, 208],
    skyBottom = [212, 231, 243],
    waterShallow = [64, 122, 158],
    waterDeep = [16, 44, 92],
    fogStrength = 0.5,
    perspective = 0.35,
    relief = 0.9,
    horizon = 0.84,
  } = opts;

  const { SW, L, sample } = makeSideSampler(height, W, H, dir);
  const { sample: sampleB } = makeSideSampler(biome, W, H, dir);
  const rgba = new Uint8Array(SW * SH * 4);

  const seaRow = Math.round(SH * horizon);
  const topRow = Math.max(4, Math.round(SH * 0.06));
  const landSpan = seaRow - topRow;
  const underSpan = SH - 1 - seaRow;

  // Небо: вертикальный градиент + светлая дымка у горизонта.
  for (let y = 0; y < SH; y++) {
    const t = y / (SH - 1);
    const hz = Math.exp(-Math.pow((t - horizon) * 6, 2)) * 0.4;
    for (let x = 0; x < SW; x++) {
      const o = (y * SW + x) * 4;
      rgba[o] = lerp(lerp(skyTop[0], skyBottom[0], t), 236, hz);
      rgba[o + 1] = lerp(lerp(skyTop[1], skyBottom[1], t), 243, hz);
      rgba[o + 2] = lerp(lerp(skyTop[2], skyBottom[2], t), 248, hz);
      rgba[o + 3] = 255;
    }
  }

  // Линия горизонта открытого моря.
  for (let x = 0; x < SW; x++) {
    const o = (seaRow * SW + x) * 4;
    rgba[o] = lerp(rgba[o], 178, 0.5);
    rgba[o + 1] = lerp(rgba[o + 1], 205, 0.5);
    rgba[o + 2] = lerp(rgba[o + 2], 222, 0.5);
  }

  const skyline = new Int32Array(SW).fill(SH);
  const col = [0, 0, 0];

  const rowOf = (h) => {
    if (h > seaLevel) {
      return seaRow - ((h - seaLevel) / (1 - seaLevel)) * landSpan * relief;
    }
    return seaRow + ((seaLevel - h) / seaLevel) * underSpan * 0.95;
  };

  // Ближние слои рисуются первыми; дальние достраивают силуэт сверху.
  for (let k = L - 1; k >= 0; k--) {
    const nearT = k / Math.max(1, L - 1);      // 1 = близко к наблюдателю
    const dist = 1 - nearT;                    // 1 = далеко
    const persp = 1 - Math.pow(dist, 1.3) * perspective;
    const fog = fogStrength * Math.pow(dist, 1.15);

    for (let sx = 0; sx < SW; sx++) {
      const h = sample(sx, k);
      let adjH = h;
      if (h > seaLevel) adjH = seaLevel + (h - seaLevel) * persp;
      const top = Math.round(rowOf(adjH));
      const end = skyline[sx];
      if (top >= end) continue;

      const b = sampleB(sx, k);
      terrainColor(b, h, seaLevel, rockLine, snowLine, col);

      // Затенение: боковой уклон + разворот грани к наблюдателю.
      const sxm = Math.max(0, sx - 2), sxp = Math.min(SW - 1, sx + 2);
      const lat = clamp((sample(sxm, k) - sample(sxp, k)) * 4.5, -0.35, 0.35);
      const k2 = k < L - 1 ? k + 1 : k - 1;
      const face = clamp((h - sample(sx, k2)) * 4.0, -0.3, 0.3);
      let shade = 0.86 + lat + face;
      if (h > seaLevel) shade += 0.06 * ((h - seaLevel) / (1 - seaLevel)); // подсветка вершин

      // Воздушная перспектива: далёкое тает в дымке горизонта.
      let r = lerp(col[0] * shade, 214, fog);
      let gg = lerp(col[1] * shade, 228, fog);
      let bb = lerp(col[2] * shade, 240, fog);

      for (let row = top; row < end; row++) {
        const o = (row * SW + sx) * 4;
        // Лёгкое затемнение к подножию — «приземляет» массу.
        const gr = 0.94 + 0.06 * (1 - row / SH);
        rgba[o] = r * gr; rgba[o + 1] = gg * gr; rgba[o + 2] = bb * gr;
      }
      skyline[sx] = top;
    }
  }

  // Море: полупрозрачное у поверхности, плотное в глубине.
  for (let sx = 0; sx < SW; sx++) {
    for (let row = seaRow + 1; row < SH; row++) {
      const o = (row * SW + sx) * 4;
      const d = (row - seaRow) / Math.max(1, underSpan);
      const a = 0.45 + 0.5 * smoothstep(0, 0.7, d);
      rgba[o] = lerp(rgba[o], lerp(waterShallow[0], waterDeep[0], d), a);
      rgba[o + 1] = lerp(rgba[o + 1], lerp(waterShallow[1], waterDeep[1], d), a);
      rgba[o + 2] = lerp(rgba[o + 2], lerp(waterShallow[2], waterDeep[2], d), a);
    }
  }

  return { rgba, width: SW, height: SH };
}

// ---------------------------------------------------------------- проходимость

const TRAV_COLORS = {
  deepWater: [16, 34, 78, 255],    // непроходимо: глубина
  water:     [58, 118, 170, 255],  // непроходимо: мелководье
  lake:      [70, 140, 150, 255],  // непроходимо: озеро
  beach:     [232, 216, 158, 255], // легко: пляж
  easy:      [124, 188, 108, 255], // легко: равнина
  moderate:  [188, 202, 92, 255],  // средне: лес / уклон
  hard:      [222, 152, 62, 255],  // тяжело: холмы
  marsh:     [74, 122, 96, 255],   // тяжело: болото
  rock:      [156, 154, 148, 255], // тяжело: скалы
  impassable:[138, 42, 42, 255],   // непроходимо: снег / обрыв
};

const TRAV_LEGEND = [
  { color: TRAV_COLORS.easy, label: 'легко (равнина, пляж)' },
  { color: TRAV_COLORS.moderate, label: 'средне (лес, уклон)' },
  { color: TRAV_COLORS.hard, label: 'тяжело (холмы)' },
  { color: TRAV_COLORS.marsh, label: 'тяжело (болото)' },
  { color: TRAV_COLORS.rock, label: 'тяжело (скалы)' },
  { color: TRAV_COLORS.impassable, label: 'непроходимо (снег, обрыв)' },
  { color: TRAV_COLORS.lake, label: 'непроходимо (озеро)' },
  { color: TRAV_COLORS.water, label: 'непроходимо (мелководье)' },
  { color: TRAV_COLORS.deepWater, label: 'непроходимо (глубина)' },
];

function renderTraversability(height, water, biome, W, H, opts = {}) {
  const {
    colors = TRAV_COLORS,
    seaLevel = 0.35,
    slopeModerate = 0.02,   // в equив. 512 px: подъём на пиксель
    slopeHard = 0.05,
  } = opts;

  const rgba = new Uint8Array(W * H * 4);
  const refScale = W / 512;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const b = biome[i];
      let col;

      switch (b) {
        case BIOME.OCEAN_DEEP: col = colors.deepWater; break;
        case BIOME.OCEAN_SHALLOW: col = colors.water; break;
        case BIOME.LAKE: col = colors.lake; break;
        case BIOME.BEACH: col = colors.beach; break;
        case BIOME.PLAIN: col = colors.easy; break;
        case BIOME.FOREST: col = colors.moderate; break;
        case BIOME.MARSH: col = colors.marsh; break;
        case BIOME.HILL: col = colors.hard; break;
        case BIOME.ROCK: col = colors.rock; break;
        default: col = colors.impassable; break; // SNOW, CLIFF
      }

      // Уточнение по уклону: пологая зелень может быть «средне».
      if (b === BIOME.PLAIN || b === BIOME.BEACH || b === BIOME.FOREST) {
        const xm = x > 0 ? x - 1 : 0, xp = x < W - 1 ? x + 1 : W - 1;
        const ym = y > 0 ? y - 1 : 0, yp = y < H - 1 ? y + 1 : H - 1;
        const sx = (height[y * W + xp] - height[y * W + xm]) * 0.5 * refScale;
        const sy = (height[yp * W + x] - height[ym * W + x]) * 0.5 * refScale;
        const slope = Math.sqrt(sx * sx + sy * sy);
        if (slope >= slopeHard) col = colors.rock;
        else if (slope >= slopeModerate) col = colors.moderate;
      }

      const o = i * 4;
      rgba[o] = col[0]; rgba[o + 1] = col[1]; rgba[o + 2] = col[2]; rgba[o + 3] = col[3] ?? 255;
    }
  }
  return rgba;
}

  GEN.BIOME = BIOME;
  GEN.BIOME_LABELS = BIOME_LABELS;
  GEN.landP99 = landP99;
  GEN.classifyTerrain = classifyTerrain;
  GEN.DEFAULT_WATER_PALETTE = DEFAULT_WATER_PALETTE;
  GEN.samplePalette = samplePalette;

/* ---- on-device island build: one stored elevation field -> top-down map
   + side skyline + land grid. No PNG, no DOM. ---- */
function genIslandRGBA(o){
  var W = o.width|0, H = o.height|0, seed = (o.seed|0), mode = o.mode||'volcanic';
  var sea = (o.seaLevel!=null) ? o.seaLevel : 0.35;
  var height = GEN.generateHeightmap({
    width:W, height:H, seed:seed, mode:mode, seaLevel:sea,
    mountains:{ peak:1.0, scale:3.2, octaves:6, ridged:true, peaks:0, hills:1.0 },
    coast:{ radius:0.92, irregularity:0.17 }
  });
  GEN.hydraulicErosion(height, W, H, { enabled:true, droplets:0, inertia:0.06, capacityFactor:4,
    erodeSpeed:0.3, depositSpeed:0.3, evaporate:0.02, gravity:4, maxSteps:56, brushRadius:3, seed:seed+1 });
  GEN.windErosion(height, W, H, { direction:Math.PI*0.25, iterations:6, advection:0.30, diffusion:0.18,
    anisotropy:3, crestErosion:0.25 });
  GEN.thermalErosion(height, W, H, { talus:0.014, iterations:9, strength:0.5 });
  GEN.despike(height, W, H, 0.05);
  height.set(GEN.smoothField(height, W, H));
  var water = GEN.computeWater(height, W, H, sea).water;
  var landTop = GEN.landP99(height, W, H, sea);
  var rockLine = sea + 0.52*(landTop - sea);
  var snowLine = sea + 0.82*(landTop - sea);
  if(mode === 'atoll') snowLine = sea + 0.96*(landTop - sea);
  var biome = GEN.classifyTerrain(height, water, W, H, {
    seaLevel:sea, rockLine:rockLine, snowLine:snowLine,
    rockFrac:0.52, snowFrac:0.82, beachWidth:0.028, cliffSlope:0.08,
    rockSlope:0.038, hillRelief:0.03, marshLevel:0.06
  });
  var top = new Uint8ClampedArray(GEN.renderTopDown(height, water, biome, W, H, {
    seaLevel:sea, rockLine:rockLine, snowLine:snowLine,
    light:[-0.62,-0.72,0.34], shadeStrength:1.0, shadeAmount:0.72
  }));
  for(var i=0;i<W*H;i++){ if(height[i] <= sea) top[i*4+3] = 0; }
  var dir = ['N','E','S','W'][(seed>>>0) % 4];
  var sv = GEN.renderSideView(height, biome, W, H, dir, {
    seaLevel:sea, rockLine:rockLine, snowLine:snowLine,
    height:260, fogStrength:0.5, perspective:0.35, relief:0.78, horizon:0.84
  });
  var side = sideCutout(height, W, H, sv.rgba, sv.width, sv.height, dir, sea);
  var GW=160, GH=116, grid=new Uint8Array(GW*GH);
  for(var gy=0; gy<GH; gy++){
    for(var gx=0; gx<GW; gx++){
      var pxs = Math.min(W-1, Math.round(gx*(W-1)/(GW-1)));
      var pys = Math.min(H-1, Math.round(gy*(H-1)/(GH-1)));
      var hi = pys*W+pxs;
      /* walkable = land that is not a snow cap; the white peaks are impassable */
      grid[gy*GW+gx] = (height[hi] > sea && biome[hi] !== GEN.BIOME.SNOW) ? 1 : 0;
    }
  }
  return { topdown:{ data:top, w:W, h:H }, side:side, land:{ grid:grid, gw:GW, gh:GH } };
}
function sideCutout(height, W, H, rgba, SW, SH, dir, sea){
  var HORIZON = 0.84, RELIEF = 0.78, PERSPECTIVE = 0.35;
  var seaRow = Math.round(SH * HORIZON);
  var topRow = Math.max(4, Math.round(SH * 0.06));
  var landSpan = seaRow - topRow;
  var L, f;
  if(dir === 'N'){ L = H; f = (sx,k) => height[(H-1-k)*W + sx]; }
  else if(dir === 'S'){ L = H; f = (sx,k) => height[k*W + sx]; }
  else if(dir === 'W'){ L = W; f = (sx,k) => height[sx*W + (W-1-k)]; }
  else { L = W; f = (sx,k) => height[sx*W + k]; }
  var out = new Uint8ClampedArray(SW * seaRow * 4);
  for(var sx=0; sx<SW; sx++){
    var sky = SH;
    for(var k=0; k<L; k++){
      var h = f(sx,k);
      var dist = 1 - k/Math.max(1, L-1);
      var persp = 1 - Math.pow(dist, 1.3) * PERSPECTIVE;
      var adj = h > sea ? sea + (h-sea)*persp : h;
      var top = Math.round(adj > sea
        ? seaRow - ((adj-sea)/(1-sea))*landSpan*RELIEF
        : seaRow + ((sea-adj)/sea)*(SH-1-seaRow)*0.95);
      if(top < sky) sky = top;
    }
    var r0 = sky < 0 ? 0 : (sky > seaRow ? seaRow : sky);
    for(var row=r0; row<seaRow; row++){
      var s = (row*SW + sx)*4;
      out[s] = rgba[s]; out[s+1] = rgba[s+1]; out[s+2] = rgba[s+2]; out[s+3] = 255;
    }
  }
  return { data:out, w:SW, h:seaRow, dir:dir };
}

/* ---- render + input ---- */

/* fill as much of the screen as the 9:16 design allows, and render the

function fitViewport(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
  DPR = Math.min(2, Math.max(1, window.devicePixelRatio||1));

}
fitViewport();
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', fitViewport);
var HY = H*0.42;

/* ---- island art: generated on-device from a seed by the embedded
   coastline generator (Parent's island-gen), so islands are built on
   premise instead of baked as pictures. One stored elevation field per
   island gives both its top-down map and its side skyline. The bundle
   sandbox blocks background threads, so builds run on the main thread,
   one per tick, deferred so the first chart paints before the first
   build. */
var ISLE_ART = {};              // seed -> { cv, w, h }  top-down
var ISLE_SIDE_IMG = {};         // seed -> { cv, w, h }  skyline
var ISLE_GEN_PENDING = {};      // seed -> true while a build is queued or running
var ISLE_GEN_QUEUE = [];        // seeds waiting to build
var ISLE_GEN_RUNNING = false;
var ISLE_GEN_W = 384, ISLE_GEN_H = 278;
var ISLE_MODES = ['volcanic','tectonic','continental'];
function isleModeFor(seed){ return ISLE_MODES[(seed>>>0) % ISLE_MODES.length]; }

function isleRGBAtoCanvas(rgba, w, h){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var cx = c.getContext('2d');
  cx.putImageData(new ImageData(new Uint8ClampedArray(rgba), w, h), 0, 0);
  return c;
}
function installIslandArt(seed, top, side, land){
  seed = seed>>>0;
  ISLE_ART[seed] = { cv: isleRGBAtoCanvas(top.data, top.w, top.h), w: top.w, h: top.h };
  ISLE_SIDE_IMG[seed] = { cv: isleRGBAtoCanvas(side.data, side.w, side.h), w: side.w, h: side.h };
  var GW = land.gw, GH = land.gh, grid = land.grid;
  ISLE_LANDFNS[seed] = (px, py)=>{
    var gx = Math.round(px*(GW-1)), gy = Math.round(py*(GH-1));
    if(gx<0) gx=0; if(gx>GW-1) gx=GW-1;
    if(gy<0) gy=0; if(gy>GH-1) gy=GH-1;
    return grid[gy*GW+gx]===1;
  };
  ISLE_GEN_PENDING[seed] = false;
}
function pumpIslandQueue(){
  if(ISLE_GEN_RUNNING || !ISLE_GEN_QUEUE.length) return;
  ISLE_GEN_RUNNING = true;
  var seed = ISLE_GEN_QUEUE.shift()>>>0;
  try{
    var r = genIslandRGBA({ seed:seed, mode:isleModeFor(seed), width:ISLE_GEN_W, height:ISLE_GEN_H });
    installIslandArt(seed, r.topdown, r.side, r.land);
  }catch(e){ ISLE_GEN_PENDING[seed] = false; }
  ISLE_GEN_RUNNING = false;
  if(ISLE_GEN_QUEUE.length) setTimeout(pumpIslandQueue, 0);
}
function requestIsland(seed, front){
  if(seed === null || seed === undefined) return;
  seed = seed>>>0;
  if(ISLE_GEN_PENDING[seed] || ISLE_ART[seed]) return;
  ISLE_GEN_PENDING[seed] = true;
  if(front) ISLE_GEN_QUEUE.unshift(seed); else ISLE_GEN_QUEUE.push(seed);
  setTimeout(pumpIslandQueue, 0);
}
function primeIslandArt(){
  for(var i=0;i<g.targets.length;i++){ if(g.targets[i].revealed) requestIsland(g.targets[i].artId); }
}

/* view transform for the map screens: pinch to zoom, drag to pan. All
   gestures live in design units; buttons stay in screen units on top. */
var VIEW = { z:1, x:0, y:0 };
function clampView(){
  VIEW.z = clamp(VIEW.z, 1, 3.4);
  VIEW.x = clamp(VIEW.x, W - W*VIEW.z, 0);
  VIEW.y = clamp(VIEW.y, H - H*VIEW.z, 0);
}
function resetView(){ VIEW.z=1; VIEW.x=0; VIEW.y=0; }
function applyBase(){ ctx.setTransform(DPR,0,0,DPR,0,0); }
function applyWorld(){ ctx.setTransform(DPR*VIEW.z,0,0,DPR*VIEW.z, DPR*VIEW.x, DPR*VIEW.y); }
function toWorld(p){ return { x:(p.x-VIEW.x)/VIEW.z, y:(p.y-VIEW.y)/VIEW.z }; }
function sceneIsMap(){ return g.scene==='chart' || g.scene==='island'; }
var KEYS = {};
var g = newGame(12345);
primeIslandArt();
var last = 0;

/* ---- sound: one WebAudio layer, no assets. The context is created and
   resumed inside the first real gesture, so autoplay policy passes.
   Every node call is guarded, so headless runs and sims stay silent. */
var AU = { ctx:null, ok:false };
function audioArm(){
  try{
    if(!AU.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return AU;
      AU.ctx = new AC();
    }
    if(AU.ctx.state === 'suspended') AU.ctx.resume();
    AU.ok = true;
  }catch(e){ AU.ok = false; }
  return AU;
}
function tone(freq, dur, type, vol, slideTo, delay){
  try{
    if(!AU.ok || !AU.ctx) return;
    var c = AU.ctx, t0 = c.currentTime + (delay||0);
    var o = c.createOscillator(), gn = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
    var v = (vol===undefined?0.08:vol);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(v, t0+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur, vol, delay){
  try{
    if(!AU.ok || !AU.ctx) return;
    var c = AU.ctx, t0 = c.currentTime + (delay||0);
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    var s = c.createBufferSource(); s.buffer = buf;
    var gn = c.createGain(); gn.gain.value = (vol===undefined?0.10:vol);
    s.connect(gn); gn.connect(c.destination); s.start(t0);
  }catch(e){}
}
var sfx = {
  step:   () => { tone(150, 0.05, 'triangle', 0.05, 110); },
  gather: (kind) => {
    if(kind==='timber'){ tone(220,0.06,'square',0.06); tone(330,0.09,'square',0.06,0,0.06); }
    else { tone(660,0.05,'sine',0.07); tone(880,0.10,'sine',0.07,0,0.05); }
  },
  heading: () => { tone(520,0.05,'square',0.05); tone(700,0.06,'square',0.05,0,0.05); },
  sail:    () => { noiseBurst(0.35, 0.06); tone(180,0.4,'sawtooth',0.05,90); },
  land:    () => { tone(90,0.18,'triangle',0.10,60); noiseBurst(0.18,0.08); },
  night:   () => { tone(300,0.5,'sine',0.05,180); },
  lose:    () => { tone(200,0.9,'sawtooth',0.07,60); },
  win:     () => { tone(523,0.12,'square',0.07); tone(659,0.12,'square',0.07,0,0.12); tone(784,0.25,'square',0.07,0,0.24); }
};
var SFX = sfx;   // the core's cue() looks this up by name

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

function tOf(d){ return Math.max(0, 1 - d/DMAX); }
function projScale(d){ return 0.20 + 1.55*Math.pow(tOf(d), 1.7); }
function projX(lane, d){ var k = 26 + 320*Math.pow(tOf(d), 1.5); return W/2 + (lane - g.heading)*k; }
function projY(d){ return HY + (H*0.70 - HY)*Math.pow(tOf(d), 1.5); }

/* ---- art helpers ---- */
function lerp(a,b,t){ return a + (b-a)*t; }
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mix(a,b,t){
  var A=hex2rgb(a), B=hex2rgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';
}
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2); if(r<0) r=0;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

var HAZE = '#cbe6f0';
var SUNX = W*0.63;

/* ---- sky ---- */
var CLOUDS = [
  {x:0.16, y:0.34, s:1.00, spd:6.0},
  {x:0.62, y:0.18, s:0.70, spd:9.0},
  {x:0.86, y:0.54, s:1.25, spd:4.5},
  {x:0.40, y:0.68, s:0.55, spd:12.0}
];
function drawSky(){
  var grd = ctx.createLinearGradient(0,0,0,HY);
  grd.addColorStop(0,'#1c6fb4');
  grd.addColorStop(0.42,'#5fb0df');
  grd.addColorStop(0.74,'#a7d8ec');
  grd.addColorStop(1,'#ffe0b0');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,HY);
  var suny = HY*0.40;
  var halo = ctx.createRadialGradient(SUNX,suny,2,SUNX,suny,66);
  halo.addColorStop(0,'rgba(255,247,214,0.95)');
  halo.addColorStop(0.25,'rgba(255,238,180,0.45)');
  halo.addColorStop(1,'rgba(255,238,180,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(SUNX,suny,66,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fffbe8'; ctx.beginPath(); ctx.arc(SUNX,suny,7,0,Math.PI*2); ctx.fill();
  for(var i=0;i<CLOUDS.length;i++){
    var c=CLOUDS[i];
    var cxp = ((c.x*W + g.time*c.spd) % (W+180)) - 90;
    drawCloud(cxp, HY*c.y, c.s);
  }
  var bx = W*0.30 + Math.sin(g.time*0.3)*6, by = HY*0.28;
  bird(bx,by); bird(bx+15,by+7); bird(bx-10,by+10);
}
function drawCloud(x,y,s){
  ctx.save();
  ctx.globalAlpha = 0.92; ctx.fillStyle = '#f4fbff';
  ctx.beginPath();
  ctx.ellipse(x, y, 26*s, 8*s, 0, 0, Math.PI*2);
  ctx.ellipse(x-14*s, y+3*s, 16*s, 6*s, 0, 0, Math.PI*2);
  ctx.ellipse(x+16*s, y+3*s, 18*s, 6*s, 0, 0, Math.PI*2);
  ctx.ellipse(x+2*s, y-5*s, 15*s, 7*s, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = '#cfe8f6';
  ctx.beginPath(); ctx.ellipse(x, y+6*s, 24*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function bird(x,y){
  ctx.strokeStyle='#33526a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-3,y); ctx.lineTo(x,y-2); ctx.lineTo(x+3,y); ctx.stroke();
}

/* far islands sit on the horizon and slide with your heading */
var FAR_ISLES = [
  {lane:-0.78, s:0.95}, {lane:-0.36, s:0.60}, {lane:0.14, s:0.50},
  {lane:0.52, s:1.05}, {lane:0.86, s:0.70}
];
function drawFarIslands(){
  for(var i=0;i<FAR_ISLES.length;i++){
    var f=FAR_ISLES[i];
    var x = W/2 + (f.lane - g.heading)*205;
    if(x < -140 || x > W+140) continue;
    var wdt = 120*f.s, h = wdt*0.28;
    ctx.fillStyle = mix('#8fbfcb', HAZE, 0.70);
    ctx.beginPath();
    ctx.moveTo(x-wdt/2, HY+3);
    ctx.lineTo(x-wdt*0.20, HY+3-h);
    ctx.lineTo(x+wdt*0.14, HY+3-h*0.68);
    ctx.lineTo(x+wdt/2, HY+3);
    ctx.closePath(); ctx.fill();
  }
}

/* ---- sea ---- */
function drawSea(){
  var grd = ctx.createLinearGradient(0,HY,0,H);
  grd.addColorStop(0,'#c6e7f2');
  grd.addColorStop(0.10,'#8ccde6');
  grd.addColorStop(0.34,'#4fa3c9');
  grd.addColorStop(0.68,'#2c7ba1');
  grd.addColorStop(1,'#1a5878');
  ctx.fillStyle=grd; ctx.fillRect(0,HY,W,H-HY);
  var hz = ctx.createLinearGradient(0,HY,0,HY+48);
  hz.addColorStop(0,'rgba(226,244,250,0.95)');
  hz.addColorStop(1,'rgba(226,244,250,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,HY,W,48);
  for(var i=0;i<44;i++){
    var tt = i/44;
    var gy = HY + 10 + Math.pow(tt,1.4)*(H*0.72-HY);
    var spread = 6 + tt*42;
    var gx = SUNX + Math.sin(g.time*2.2 + i*1.9)*spread;
    ctx.globalAlpha = (1-tt)*0.55*(0.5+0.5*Math.sin(g.time*3+i));
    px(gx, gy, 2+tt*4, 1+tt, '#fff6cf');
  }
  ctx.globalAlpha=1;
  var rows = 15;
  for(var r=0;r<rows;r++){
    var tr = r/(rows-1);
    var y = HY + Math.pow(tr,1.22)*(H-HY);
    var amp = 2 + tr*5;
    var speed = 12 + tr*80;
    ctx.globalAlpha = 0.06 + tr*0.20; ctx.fillStyle = '#0d3f5c';
    ctx.fillRect(0, y, W, 1 + tr*2);
    ctx.globalAlpha = 0.50 - tr*0.28; ctx.fillStyle = '#e9fbff';
    for(var x=-60; x<W+60; x+=46){
      var off = (g.time*speed + r*37) % 46;
      var wx = x - off;
      var wy = y + Math.sin(wx*0.05 + g.time*1.4 + r)*amp*0.5;
      ctx.fillRect(wx, wy, 10 + tr*26, 1 + Math.round(tr*1.5));
    }
    ctx.globalAlpha = 1;
  }
}
function drawWake(){
  var baseY = H*1.005, topY = H*0.80;
  ctx.save();
  var grd = ctx.createLinearGradient(0,topY,0,baseY);
  grd.addColorStop(0,'rgba(233,251,255,0.60)');
  grd.addColorStop(0.5,'rgba(200,235,248,0.32)');
  grd.addColorStop(1,'rgba(200,235,248,0)');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(W/2-5, topY);
  ctx.lineTo(W/2-72, baseY);
  ctx.lineTo(W/2+72, baseY);
  ctx.lineTo(W/2+5, topY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#f4feff';
  for(var i=0;i<6;i++){
    var tt=(i+1)/7;
    var y = topY + (baseY-topY)*tt;
    var w = 8 + 60*tt;
    var jit = Math.sin(g.time*6 + i*1.6)*3;
    ctx.globalAlpha = 0.75*(1-tt*0.5);
    ctx.lineWidth = 1 + tt;
    ctx.beginPath();
    ctx.moveTo(W/2 - w/2 + jit, y);
    ctx.quadraticCurveTo(W/2, y+4+tt*3, W/2 + w/2 + jit, y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- island silhouette with atmosphere ---- */
function drawIslandSil(x, baseY, wdt, kind, fog){
  fog = clamp(fog||0, 0, 1);
  var h = kind==='big' ? wdt*0.50 : wdt*0.36;
  var body  = mix(kind==='big' ? '#2f7358' : '#3c8768', HAZE, fog*0.82);
  var back  = mix('#3f7d63', HAZE, fog*0.90);
  var lit   = mix('#5cae86', HAZE, fog*0.78);
  var beach = mix('#e6d9a8', HAZE, fog*0.85);
  ctx.fillStyle = back;
  ctx.beginPath();
  ctx.moveTo(x-wdt/2, baseY+4);
  ctx.lineTo(x-wdt*0.42, baseY+4-h*0.40);
  ctx.lineTo(x-wdt*0.16, baseY+4-h*0.70);
  ctx.lineTo(x+wdt*0.06, baseY+4-h*0.42);
  ctx.lineTo(x+wdt*0.34, baseY+4-h*0.64);
  ctx.lineTo(x+wdt/2, baseY+4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = beach;
  ctx.beginPath(); ctx.ellipse(x, baseY+3, wdt*0.52, Math.max(3,wdt*0.05), 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(x-wdt/2, baseY+3);
  ctx.lineTo(x-wdt*0.30, baseY+3-h*0.55);
  ctx.lineTo(x-wdt*0.10, baseY+3-h);
  ctx.lineTo(x+wdt*0.08, baseY+3-h*0.62);
  ctx.lineTo(x+wdt*0.30, baseY+3-h*0.82);
  ctx.lineTo(x+wdt/2, baseY+3);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.55; ctx.fillStyle = lit;
  ctx.beginPath();
  ctx.moveTo(x-wdt*0.10, baseY+3-h);
  ctx.lineTo(x+wdt*0.08, baseY+3-h*0.62);
  ctx.lineTo(x+wdt*0.30, baseY+3-h*0.82);
  ctx.lineTo(x+wdt*0.17, baseY+3-h*0.48);
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  if(kind==='big'){
    ctx.fillStyle = mix('#f2f6fb', HAZE, fog*0.6);
    ctx.beginPath();
    ctx.moveTo(x-wdt*0.10, baseY+3-h);
    ctx.lineTo(x-wdt*0.045, baseY+3-h*0.86);
    ctx.lineTo(x, baseY+3-h*0.97);
    ctx.lineTo(x+wdt*0.05, baseY+3-h*0.85);
    ctx.lineTo(x+wdt*0.08, baseY+3-h*0.62);
    ctx.lineTo(x-wdt*0.10, baseY+3-h);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = mix('#255c46', HAZE, fog*0.85);
    px(x-wdt*0.06, baseY+1-h*0.99, 2, 6, ctx.fillStyle);
    px(x+wdt*0.02, baseY+1-h*0.80, 2, 5, ctx.fillStyle);
  }
}
function drawRifts(){
  var list = g.rifts.slice().sort((a,b)=> b.d - a.d);
  for(var i=0;i<list.length;i++){
    var rf=list[i];
    var x = projX(rf.lane, rf.d);
    var y = projY(rf.d);
    var s = projScale(rf.d);
    if(y < HY+2 || x < -80 || x > W+80) continue;
    var w = 34*s + 6, h = 16*s + 3;
    ctx.globalAlpha = 0.9 * clamp((rf.age||0)/0.5, 0, 1);
    ctx.fillStyle='#26424f';
    ctx.beginPath();
    ctx.moveTo(x-w/2, y); ctx.lineTo(x-w*0.25, y-h*0.6);
    ctx.lineTo(x+w*0.1, y-h); ctx.lineTo(x+w*0.3, y-h*0.4);
    ctx.lineTo(x+w/2, y); ctx.closePath(); ctx.fill();
    px(x-w/2, y, w, 2, '#5a7d92');
    ctx.globalAlpha = 1;
  }
}
/* the target island on the horizon: use its real generator side-view
   skyline (one stored field, seen from the water) instead of a polygon. */
function sideSpriteFor(t){
  if(typeof ISLE_SIDE_IMG==='undefined' || !t) return null;
  return ISLE_SIDE_IMG[t.artId] || null;
}
function drawSideSprite(img, x, baseY, wdt, fog){
  var h = wdt * (img.h/img.w);
  var a = clamp(1 - fog*0.80, 0.15, 1);
  var base = baseY + 2;                     /* settle it a touch into the sea */
  ctx.save();
  /* a soft mirrored reflection below the waterline so the base does not
     read as a pasted cut (dy = -h/2 under scale(1,-1) puts it under, not over) */
  ctx.globalAlpha = a*0.20;
  ctx.save();
  ctx.translate(x, base); ctx.scale(1, -1);
  ctx.drawImage(img.cv, -wdt/2, -h*0.5, wdt, h*0.5);
  ctx.restore();
  ctx.globalAlpha = a;
  ctx.drawImage(img.cv, x - wdt/2, base - h, wdt, h);
  /* foam line where the coast meets the water */
  ctx.globalAlpha = clamp(0.5*(1-clamp(fog,0,1)), 0, 0.5);
  ctx.fillStyle = '#eefaff';
  ctx.beginPath();
  ctx.ellipse(x, base, wdt*0.44, Math.max(2, wdt*0.03), 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawTargetIsland(){
  var t = g.targets[g.target];
  if(!t) return;
  var x = projX(t.lane, t.dist);
  var y = projY(t.dist);
  var wdt = (t.big?210:130) * projScale(t.dist);
  if(x > -300 && x < W+300){
    if(t.dist <= 60){
      ctx.globalAlpha = 0.28 + 0.22*Math.sin(g.time*6);
      var h1 = (t.big?wdt*0.54:wdt*0.42);
      ctx.fillStyle = '#ffd34d';
      ctx.fillRect(x-wdt*0.60, y+4-h1, wdt*1.20, h1);
      ctx.globalAlpha = 1;
    }
    var fog = clamp((t.dist-80)/900, 0, 0.75);
    var spr = sideSpriteFor(t);
    if(spr && spr.cv && spr.cv.width){
      drawSideSprite(spr, x, y, wdt, fog);
    } else {
      drawIslandSil(x, y, wdt, t.big, fog);
    }
  }
}

/* ---- the raft (the hero) ---- */
function drawRaft(){
  var cx = W/2;
  var bob = Math.sin(g.time*2.2)*1.5;
  var deckY = H*0.80 + bob;
  ctx.save();
  ctx.translate(cx, deckY);
  ctx.rotate(g.heading*0.05);

  ctx.globalAlpha = 0.30; ctx.fillStyle = '#0e3550';
  ctx.beginPath(); ctx.ellipse(0, 30, 56, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  var logs = 6, i, t;
  for(i=0;i<logs;i++){
    t = i/(logs-1);
    var lx = lerp(-46, 46, t);
    ctx.fillStyle = mix('#8a6038', '#6f4a29', 0.25 + (i%2)*0.30);
    ctx.beginPath(); ctx.ellipse(lx, 25, 8, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = mix('#c79b63','#a87f4c',(i%2));
    ctx.beginPath(); ctx.ellipse(lx, 25, 4.8, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5b3d22';
    ctx.beginPath(); ctx.ellipse(lx, 25, 2.2, 2.2, 0, 0, Math.PI*2); ctx.fill();
  }

  var dg = ctx.createLinearGradient(0,-8,0,22);
  dg.addColorStop(0,'#c3945c'); dg.addColorStop(0.5,'#a97a44'); dg.addColorStop(1,'#8a6038');
  ctx.fillStyle=dg;
  ctx.beginPath();

var CHART_C = { x:W/2, y:H*0.78, R:Math.min(W,H)*0.60 };

function drawChartBg(){

function drawChartWorld(){
  ctx.strokeStyle='rgba(90,150,180,0.10)'; ctx.lineWidth=1;
  for(var yy=18; yy<H; yy+=34){
    ctx.beginPath();
    for(var xx=0; xx<=W; xx+=20){
      var wy = yy + Math.sin((xx+yy)*0.05 + g.time*0.6)*3;
      if(xx===0) ctx.moveTo(xx,wy); else ctx.lineTo(xx,wy);
    }
    ctx.stroke();
  }
  drawCompass(52, H*0.26);
  var reach = reachOf(g);
  var rr2 = (reach/DMAX) * CHART_C.R;
  ctx.strokeStyle='#63d6a0'; ctx.setLineDash([5,5]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CHART_C.x, CHART_C.y, Math.max(6,rr2), Math.PI, 0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=0.12; ctx.fillStyle='#63d6a0';
  ctx.beginPath(); ctx.arc(CHART_C.x, CHART_C.y, Math.max(6,rr2), Math.PI, 0); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#eef4ff'; px(CHART_C.x-5, CHART_C.y-5, 10, 10, '#eef4ff');
  ctx.strokeStyle='#bfe9ff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CHART_C.x, CHART_C.y, 9, 0, Math.PI*2); ctx.stroke();
  var shown = 0;
  for(var i=0;i<g.targets.length;i++){
    var t=g.targets[i];
    if(t.done || !t.revealed) continue;
    shown++;
    var p=chartPos(t.lane, t.dist);
    var within = t.dist <= reach;
    var col = t.big ? (within?'#ffd34d':'#c9ad5e') : (within?'#dff0ff':'#9fbed2');
    var pulse = 0.5 + 0.5*Math.sin(g.time*2.6 + i*1.9);
    /* a breathing halo keeps the idle chart from reading as a still
       image: every sighted island flickers, in reach ones brighter. */
    ctx.globalAlpha = (within ? 0.30 : 0.16) * (0.40 + 0.60*pulse);
    ctx.fillStyle = within ? '#63d6a0' : '#7fa0b6';
    ctx.beginPath(); ctx.arc(p.x, p.y, (t.big?16:11) + pulse*4.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = within ? (0.72 + 0.28*pulse) : 0.85;
    ctx.strokeStyle = within ? '#dff2ff' : '#7fa0b6'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, (t.big?10:6.5) + pulse*2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(p.x, p.y, t.big?6:3.8, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.font='12px ui-monospace,monospace';
    var lw = ctx.measureText(t.name).width;
    ctx.globalAlpha=0.88; px(p.x-lw/2-4, p.y-24, lw+8, 16, '#04223a'); ctx.globalAlpha=1;
    ctx.fillStyle = within ? '#ffffff' : '#cfe0ee';
    ctx.fillText(t.name, p.x-lw/2, p.y-12);
  }
  g._chartShown = shown;
}

var ISLE_BTNS = {
  day:   {x:8,   y:H-80, w:110, h:54, label:'NEXT DAY', sub:''},
  gather:{x:125, y:H-80, w:110, h:54, label:'GATHER', sub:''},

};
var ISLE_RECT = {x:10, y:104, w:W-20, h:Math.round((W-20)*740/1024)};
function islePix(n){
  return { x: ISLE_RECT.x + n.x*ISLE_RECT.w, y: ISLE_RECT.y + n.y*ISLE_RECT.h };
}
var NODE_R = 22;
function pickNode(p){
  if(!g.isle) return null;
  var gr = g.isle.graph, best=null, bd=Infinity;
  for(var i=0;i<gr.n;i++){
    var pp = islePix(gr.nodes[i]);
    var d = dist2(pp.x, pp.y, p.x, p.y);
    if(d < bd){ bd = d; best = i; }
  }
  return (bd <= NODE_R*NODE_R) ? best : null;
}
function drawIslandBg(){
  var grd = ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0b2b3d'); grd.addColorStop(1,'#0e2230');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
}
function drawIslandWorld(){
  var is = g.isle, gr = is?is.graph:null, at = is?is.at:0;
  var art = is ? ISLE_ART[is.artId] : null;
  var cx = ISLE_RECT.x + ISLE_RECT.w/2, cy = ISLE_RECT.y + ISLE_RECT.h/2;
  // a soft lagoon so the island sits in water, not on a flat panel
  ctx.globalAlpha=0.55;
  var lg = ctx.createRadialGradient(cx, cy, 8, cx, cy, ISLE_RECT.w*0.64);
  lg.addColorStop(0,'#2f88b0'); lg.addColorStop(1,'rgba(47,136,176,0)');
  ctx.fillStyle=lg;
  ctx.beginPath(); ctx.ellipse(cx, cy, ISLE_RECT.w*0.60, ISLE_RECT.h*0.62, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  if(art && art.cv){
    // this island's own generator render: opaque land, clear sea
    ctx.drawImage(art.cv, ISLE_RECT.x, ISLE_RECT.y, ISLE_RECT.w, ISLE_RECT.h);
  } else {
    // fallback shape, until the render has loaded
    ctx.fillStyle = '#e6d9a8';
    ctx.beginPath(); ctx.ellipse(cx, cy, ISLE_RECT.w*0.52, ISLE_RECT.h*0.45, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2f6b4d';
    ctx.beginPath(); ctx.ellipse(cx, cy, ISLE_RECT.w*0.49, ISLE_RECT.h*0.42, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3d8259';
    ctx.beginPath(); ctx.ellipse(cx, cy-6, ISLE_RECT.w*0.38, ISLE_RECT.h*0.32, 0, 0, Math.PI*2); ctx.fill();
  }
  var canAct = is && is.actions > 0;
  if(gr){
    for(i=0;i<gr.edges.length;i++){
      var e = gr.edges[i];
      var a = islePix(gr.nodes[e[0]]), b = islePix(gr.nodes[e[1]]);
      var live = canAct && (e[0]===at || e[1]===at);
      ctx.strokeStyle = live ? '#bfe9ff' : '#4f7f98';
      ctx.lineWidth = live ? 2.4 : 1.2;
      ctx.setLineDash(live ? [] : [3,4]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.setLineDash([]);
    if(is.hint){
      var hp = islePix(gr.nodes[is.hint.from]);
      var rad = ({north:0,'north-east':Math.PI/4,east:Math.PI/2,'south-east':3*Math.PI/4,
                  south:Math.PI,'south-west':5*Math.PI/4,west:3*Math.PI/2,'north-west':7*Math.PI/4})[is.hint.b];
      var hx = Math.sin(rad), hy = -Math.cos(rad);
      ctx.strokeStyle='#d6c8ff'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(hp.x+hx*12, hp.y+hy*12); ctx.lineTo(hp.x+hx*38, hp.y+hy*38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hp.x+hx*38, hp.y+hy*38);
      ctx.lineTo(hp.x+hx*30-hy*6, hp.y+hy*30+hx*6);
      ctx.lineTo(hp.x+hx*30+hy*6, hp.y+hy*30-hx*6);
      ctx.closePath(); ctx.fillStyle='#d6c8ff'; ctx.fill();
    }
  }
  var known = 0, total = gr?gr.n:0;
  if(gr){
    for(var j=0;j<gr.n;j++){
      var n = gr.nodes[j], p = islePix(n);
      var current = (j===at);
      var reachable = canAct && (current || gr.adj[at].indexOf(j)>=0);
      var kind = ISLE_KIND[n.type] || ISLE_KIND.plain;
      if(n.seen) known++;
      if(!n.seen && !current){
        px(p.x-4, p.y-4, 8, 8, reachable ? '#9fd8ff' : '#3f8098');
        if(reachable){
          ctx.strokeStyle='#bfe9ff'; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.stroke();
        }
        continue;
      }
      var col = current ? '#3dd68f' : kind.col;
      px(p.x-6, p.y-6, 12, 12, '#04223a');
      px(p.x-4, p.y-4, 8, 8, col);
      if(reachable && !current){
        ctx.strokeStyle='#bfe9ff'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.stroke();
      }
      var lbl = kind.label;
      ctx.font = '11px ui-monospace,monospace';
      var lw = ctx.measureText(lbl).width;
      var lx = Math.round(p.x - lw/2), ly = Math.round(p.y - 10);
      px(lx-4, ly-13, lw+8, 15, 'rgba(4,34,58,0.95)');
      ctx.fillStyle = current ? '#ffffff' : kind.col;
      ctx.fillText(lbl, lx, ly);
    }
  }
  g._isleKnown = known; g._isleTotal = total;
}

  var rowH = 16, top = ISLE_RECT.y + ISLE_RECT.h + 24, bottom = H-108;

  var canGather = !noActs && (atKind==='forage' || atKind==='water' || atKind==='timber');
  var gatherWord = atKind==='forage' ? 'grove' : atKind==='water' ? 'spring' : atKind==='timber' ? 'rock' : '';
  var gbtn = {x:ISLE_BTNS.gather.x, y:ISLE_BTNS.gather.y, w:ISLE_BTNS.gather.w, h:ISLE_BTNS.gather.h,

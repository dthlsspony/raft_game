<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raft slice</title>
<style>
  html,body{margin:0;height:100%;background:#123a52;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;background:#2e7fc4;box-shadow:0 0 0 2px #2b6d90,0 20px 60px #0006;max-width:100vw;max-height:100vh;touch-action:none}
  #hint{position:fixed;left:0;right:0;bottom:4px;text-align:center;color:#dfeffa;font-size:11px;letter-spacing:.5px;pointer-events:none;text-shadow:0 1px 2px #0a2a3e}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="360" height="640"></canvas></div>
<div id="hint">chart: tap a destination &nbsp;·&nbsp; sea: drag to steer &nbsp;·&nbsp; rifts break the raft</div>
<div id="err" style="position:fixed;top:0;left:0;color:#f66;font-size:12px;z-index:9"></div>
<script id="core">
/* ---- pure core: extractable, DOM-free ---- */
var DMAX = 1000;          // world units from horizon to the raft
var BASE_SPEED = 25;      // units per second
var DR_FOOD = 2.6, DR_WATER = 2.0;   // supply drain per second at sea
var RIFT_DMG = 14, RIFT_COST = 5;
var LAND_RANGE = 170;     // how close you can be and still tap to land

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function rngFactory(seed){
  var s = (seed>>>0) || 1;
  return () => {
    s = (s + 0x9e3779b9)>>>0;
    var t = s;
    t ^= t>>>16; t = Math.imul(t, 0x21f0aaad)>>>0;
    t ^= t>>>15; t = Math.imul(t, 0x735a2d97)>>>0;
    t ^= t>>>15;
    return (t>>>0)/4294967296;
  };
}

/* reach in world units the current supplies allow */
function reachOf(g){
  var worst = Math.max(DR_FOOD, DR_WATER);
  var secs = Math.min(g.food/DR_FOOD, g.water/DR_WATER);
  return BASE_SPEED * secs;
}

function makeTargets(seed){
  var rnd = rngFactory(seed);
  var t = [];
  var near = 240 + rnd()*90;
  var mid  = 500 + rnd()*90;
  var far  = 740 + rnd()*80;
  t.push({lane:(rnd()*2-1)*0.85, dist:near, seed:Math.floor(rnd()*1e9), big:false, name:'ISLE A'});
  t.push({lane:(rnd()*2-1)*0.85, dist:mid,  seed:Math.floor(rnd()*1e9), big:false, name:'ISLE B'});
  t.push({lane:(rnd()*2-1)*0.85, dist:far,  seed:Math.floor(rnd()*1e9), big:false, name:'ISLE C'});
  t.push({lane:(rnd()*2-1)*0.45, dist:950,  seed:Math.floor(rnd()*1e9), big:true,  name:'THE BIG LAND'});
  return t;
}

function newGame(seed){
  var g = {
    seed:(seed>>>0)||1,
    rnd:rngFactory(seed),
    scene:'chart',
    food:100, water:100, integrity:100, materials:0,
    legs:0,
    targets:makeTargets(seed),
    target:-1,
    heading:0, steer:0, dragging:false,
    time:0,
    rifts:[],
    hitFlash:0,
    msg:'pick a heading',
    ended:false, won:false
  };
  return g;
}

function aliveTargets(g){
  var out=[];
  for(var i=0;i<g.targets.length;i++) if(!g.targets[i].done) out.push(i);
  return out;
}

/* spread a small, fixed handful of rifts across the leg, so they
   arrive DURING the voyage and before the island does */
function planRifts(g, legDist){
  g.rifts = [];
  var n = clamp(Math.round(legDist/380), 2, 3);
  for(var i=0;i<n;i++){
    var f = (i+1)/(n+1);
    var d = Math.min(legDist*f + 55, DMAX*0.9);
    g.rifts.push({ lane:(g.rnd()*2-1)*0.9, d:d, age:0 });
  }
  return g;
}

function chooseTarget(g, i){
  if(g.scene!=='chart') return g;
  var t = g.targets[i];
  if(!t || t.done) { g.msg='no such island'; return g; }
  g.target = i;
  g.heading = t.lane;
  g.scene = 'sail';
  g.time = 0;
  planRifts(g, t.dist);
  g.msg = 'heading for ' + t.name;
  return g;
}

function canLand(g){
  if(g.scene!=='sail') return false;
  var t = g.targets[g.target];
  if(!t) return false;
  return t.dist <= LAND_RANGE && t.dist > -6 && Math.abs(t.lane - g.heading) < 0.30;
}

function doLandfall(g){
  if(g.scene!=='sail') return g;
  var t = g.targets[g.target];
  if(!t){ g.scene='chart'; return g; }
  t.done = true;
  g.legs++;
  if(t.big){
    g.scene='win'; g.won=true; g.ended=true;
    g.msg='you reached the big land';
    return g;
  }
  g.food  = Math.min(140, g.food + 46);
  g.water = Math.min(140, g.water + 46);
  g.materials += 2;
  g.msg = 'landfall at ' + t.name + '. restocked.';
  return backToChart(g);
}

function backToChart(g){
  g.scene='chart';
  g.target=-1;
  g.rifts=[];
  return g;
}

function tickSail(g, dt){
  if(g.scene!=='sail' || g.ended) return g;
  var t = g.targets[g.target];
  if(!t){ g.scene='chart'; return g; }

  if(g.steer) g.heading = clamp(g.heading + g.steer*1.15*dt, -1, 1);
  else if(!g.dragging) g.heading = g.heading * Math.max(0, 1 - 0.9*dt);

  g.food  = Math.max(0, g.food  - DR_FOOD*dt);
  g.water = Math.max(0, g.water - DR_WATER*dt);
  if(g.food<=0 || g.water<=0){
    g.scene='over'; g.ended=true; g.msg='out of food and water on the open sea';
    return g;
  }

  t.dist -= BASE_SPEED*dt;

  // rifts approach; hitting one costs the raft
  g.time += dt;
  for(var i=g.rifts.length-1;i>=0;i--){
    var rf=g.rifts[i];
    rf.age = (rf.age||0) + dt;
    rf.d -= (BASE_SPEED+4)*dt;
    if(rf.d < -40){ g.rifts.splice(i,1); continue; }
    if(rf.d < 10 && rf.d > -2 && Math.abs(rf.lane - g.heading) < 0.16){
      g.integrity = clamp(g.integrity - RIFT_DMG, 0, 100);
      g.food = Math.max(0, g.food - RIFT_COST*0.5);
      g.water = Math.max(0, g.water - RIFT_COST*0.5);
      g.hitFlash = 0.35;
      g.msg = 'rift. raft ' + Math.round(g.integrity);
      g.rifts.splice(i,1);
      if(g.integrity<=0){ g.scene='over'; g.ended=true; g.msg='the raft broke apart on a rift'; return g; }
    }
  }
  if(g.hitFlash>0) g.hitFlash = Math.max(0, g.hitFlash-dt);

  // arrival: tapped landfall is the real path; this is only the
  // safety net so a lined-up raft does not sail straight through
  if(t.dist <= 8){
    if(Math.abs(t.lane - g.heading) < 0.30) return doLandfall(g);
    if(t.dist <= -6){
      g.scene='over'; g.ended=true;
      g.msg = 'you missed ' + t.name + ' and drifted on';
      return g;
    }
  }
  return g;
}

function tickChart(g, dt){
  if(g.scene==='chart'){ g.time += dt; }
  return g;
}
</script>
<script>
/* ---- render + input ---- */
var cv = document.getElementById('cv');
window.addEventListener('error', (e) => {
  var d = document.getElementById('err');
  if(d) d.textContent = 'JSERR: ' + e.message + ' @' + e.lineno;
});
var ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
var W = cv.width, H = cv.height;
var HY = H*0.42;
var KEYS = {};
var g = newGame(12345);
var last = 0;

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

function tOf(d){ return clamp(1 - d/DMAX, 0, 1); }
function projScale(d){ return 0.20 + 1.55*Math.pow(tOf(d), 1.7); }
function projX(lane, d){ var k = 26 + 320*Math.pow(tOf(d), 1.5); return W/2 + (lane - g.heading)*k; }
function projY(d){ return HY + (H*0.70 - HY)*Math.pow(tOf(d), 1.5); }

function drawSky(){
  var grd = ctx.createLinearGradient(0,0,0,HY);
  grd.addColorStop(0,'#2e7fc4'); grd.addColorStop(0.55,'#7dc2ea'); grd.addColorStop(1,'#ffe3ad');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,HY);
  var sunx = W*0.62, suny = HY*0.42;
  ctx.globalAlpha=0.55; px(sunx-14, suny-14, 28, 28, '#fff3c4'); ctx.globalAlpha=1;
  px(sunx-6, suny-6, 12, 12, '#fffbe8');
  ctx.globalAlpha=0.85; px(W*0.28, HY-58, 84, 8, '#eaf6ff'); px(W*0.31, HY-50, 58, 5, '#cfe8f8'); ctx.globalAlpha=1;
  ctx.globalAlpha=0.70; px(W*0.72, HY-84, 62, 6, '#eaf6ff'); ctx.globalAlpha=1;
}
function drawSea(){
  var bands = ['#8fd0ea','#6dbde0','#57b0d8','#4aa6cf','#3d9bc4','#338fb8','#2a84ac','#247aa0'];
  var n = 10;
  for(var i=0;i<n;i++){
    var y0 = HY + i*((H-HY)/n);
    var t = i/n;
    var off = (g.time*40*(0.3+t)) % 90;
    px(0, y0, W, (H-HY)/n+1, bands[Math.min(bands.length-1, Math.round(t*(bands.length-1)))]);
    for(var x=-140; x<W+140; x+=90) px(x - off + (i%2)*40, y0+3, 8+t*22, 2, '#dff4ff');
  }
  for(var k=-3;k<=3;k++) px(W/2 + k*22, HY, 2, H-HY, '#63b0cc');
}
function drawWake(){
  var baseY = H*0.995, topY = H*0.80;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(W/2-4, topY); ctx.lineTo(W/2-58, baseY);
  ctx.lineTo(W/2+58, baseY); ctx.lineTo(W/2+4, topY);
  ctx.closePath(); ctx.fillStyle='#b9e6f8'; ctx.fill();
  ctx.globalAlpha = 1;
  for(var i=0;i<5;i++){
    var t=i/5, y = topY + (baseY-topY)*t, w = 6 + 52*t;
    var jit = Math.sin(g.time*7 + i*1.7)*3;
    px(W/2 - w/2 + jit, y, w, 2, '#f0fbff');
  }
}
function drawIslandSil(x, baseY, wdt, kind){
  var h = kind==='big' ? wdt*0.44 : wdt*0.34;
  ctx.fillStyle = kind==='big' ? '#357d5e' : '#3f8a68';
  ctx.beginPath();
  ctx.moveTo(x-wdt/2, baseY+4);
  ctx.lineTo(x-wdt*0.32, baseY+4-h*0.52);
  ctx.lineTo(x-wdt*0.13, baseY+4-h);
  ctx.lineTo(x+wdt*0.05, baseY+4-h*0.6);
  ctx.lineTo(x+wdt*0.27, baseY+4-h*0.84);
  ctx.lineTo(x+wdt/2, baseY+4);
  ctx.closePath(); ctx.fill();
  px(x-wdt/2, baseY+2, wdt, Math.max(3, wdt*0.04), '#2a6a50');
  if(kind==='big'){
    px(x+wdt*0.29, baseY+4-h*0.98, Math.max(2,wdt*0.022), Math.max(9,wdt*0.09), '#e8c877');
    px(x+wdt*0.28, baseY+1-h*0.98, Math.max(4,wdt*0.05), 3, '#ffe9a8');
  }
}
function drawRifts(){
  var list = g.rifts.slice().sort((a,b)=> b.d - a.d);
  for(var i=0;i<list.length;i++){
    var rf=list[i];
    var x = projX(rf.lane, rf.d);
    var y = projY(rf.d);
    var s = projScale(rf.d);
    if(y < HY+2 || x < -80 || x > W+80) continue;
    var w = 34*s + 6, h = 16*s + 3;
    ctx.globalAlpha = 0.9 * clamp((rf.age||0)/0.5, 0, 1);
    ctx.fillStyle='#26424f';
    ctx.beginPath();
    ctx.moveTo(x-w/2, y); ctx.lineTo(x-w*0.25, y-h*0.6);
    ctx.lineTo(x+w*0.1, y-h); ctx.lineTo(x+w*0.3, y-h*0.4);
    ctx.lineTo(x+w/2, y); ctx.closePath(); ctx.fill();
    px(x-w/2, y, w, 2, '#5a7d92');
    ctx.globalAlpha = 1;
  }
}
function drawTargetIsland(){
  var t = g.targets[g.target];
  if(!t) return;
  var x = projX(t.lane, t.dist);
  var y = projY(t.dist);
  var wdt = (t.big?210:130) * projScale(t.dist);
  if(x > -300 && x < W+300){
    var inLane = Math.abs(t.lane - g.heading) < 0.30;
    if(t.dist <= 60){
      ctx.globalAlpha = 0.28 + 0.22*Math.sin(g.time*6) + (inLane?0.2:0);
      var h1 = (t.big?wdt*0.52:wdt*0.42);
      ctx.fillStyle = inLane ? '#ffd34d' : '#7a6a3a';
      ctx.fillRect(x-wdt*0.59, y+4-h1, wdt*1.18, h1);
      ctx.globalAlpha = 1;
    }
    drawIslandSil(x, y, wdt, t.big);
  }
}
function drawRaft(){
  var cx = W/2;
  var bob = Math.sin(g.time*2.2)*1.5;
  var deckTop = H*0.80 + bob;
  ctx.fillStyle='#9a7043';
  ctx.beginPath();
  ctx.moveTo(cx-30, deckTop); ctx.lineTo(cx+30, deckTop);
  ctx.lineTo(cx+46, H*0.955); ctx.lineTo(cx-46, H*0.955);
  ctx.closePath(); ctx.fill();
  for(var i=1;i<4;i++){
    var t=i/4, y=deckTop + (H*0.955-deckTop)*t, w=30+16*t;
    px(cx-w, y, w*2, 1, '#6f4d2a');
  }
  px(cx-30, deckTop, 60, 3, '#b58756');
  px(cx-2, deckTop-78, 4, 78, '#5a3f22');
  ctx.fillStyle='#efe6cf';
  ctx.beginPath();
  ctx.moveTo(cx+2, deckTop-74); ctx.lineTo(cx+2, deckTop-14); ctx.lineTo(cx+34, deckTop-22);
  ctx.closePath(); ctx.fill();
  px(cx-5, deckTop-20, 10, 13, '#eef1fa');
  px(cx-4, deckTop-26, 8, 7, '#3a3f52');
  px(cx-9, deckTop-14, 5, 8, '#eef1fa');
  px(cx+4, deckTop-14, 5, 8, '#eef1fa');
  px(cx-1, deckTop+2, 3, 12, '#6f4d2a');
}
function drawTail(){ // the burned-ship fleet, far behind, pure flavour
  var cx = W/2;
  var base = H*0.995;
  ctx.globalAlpha = 0.35;
  ctx.fillStyle='#173a52';
  ctx.beginPath();
  ctx.moveTo(cx-30, base); ctx.lineTo(cx-6, base-20);
  ctx.lineTo(cx+8, base-14); ctx.lineTo(cx+30, base);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function bar(x,y,w,v,col,label){
  px(x-1,y-1,w+2,8,'#0a0f1c'); px(x,y,w,6,'#3a5a78');
  px(x,y,Math.max(0,Math.round(w*clamp(v,0,1))),6,col);
  ctx.fillStyle='#ffffff'; ctx.font='8px ui-monospace,monospace';
  ctx.fillText(label, x, y-4);}
function drawHUD(){
  ctx.globalAlpha = 0.42; px(6,8,182,92,'#04223a');
  ctx.globalAlpha = 0.42; px(6,H-26,W-12,20,'#04223a');
  ctx.globalAlpha = 1;
  bar(12,20,110,g.food/140,'#6fcf6f','FOOD '+Math.round(g.food));
  bar(12,40,110,g.water/140,'#5fa8ff','WATER '+Math.round(g.water));
  bar(12,60,110,g.integrity/100,'#e0705a','RAFT '+Math.round(g.integrity));
  ctx.fillStyle='#ffffff'; ctx.font='10px ui-monospace,monospace';
  ctx.fillText('LEGS '+g.legs+(g.materials?('   MAT '+g.materials):''), 12, 84);
  ctx.fillStyle='#eaf4ff'; ctx.font='10px ui-monospace,monospace';
  ctx.fillText(g.msg, 12, H-12);
}
function drawSail(){
  drawSky(); drawSea(); drawWake();
  drawTargetIsland(); drawRifts(); drawRaft(); drawTail();
  var t = g.targets[g.target];
  if(t && t.dist <= LAND_RANGE){
    var inLane = Math.abs(t.lane - g.heading) < 0.30;
    ctx.fillStyle = inLane ? 'rgba(255,211,77,'+(0.55+0.4*Math.sin(g.time*6))+')' : '#eaf4ff';
    ctx.font='12px ui-monospace,monospace';
    ctx.globalAlpha = 0.55; px(W/2-56, HY-26, 112, 18, '#04223a'); ctx.globalAlpha = 1;
    ctx.fillText(inLane?'TAP TO MAKE LANDFALL':'LINE UP WITH HER', W/2-52, HY-14);
  }
  if(g.hitFlash>0){ ctx.globalAlpha=g.hitFlash/0.35*0.5; px(0,0,W,H,'#e0705a'); ctx.globalAlpha=1; }
  drawHUD();
}

/* ---- chart ---- */
var CHART_C = { x:W/2, y:H*0.80, R:min2(W,H)*0.60 };
function min2(a,b){ return a<b?a:b; }
function chartPos(lane, dist){
  var ang = lane*1.15;
  var r = (dist/DMAX) * CHART_C.R;
  return { x: CHART_C.x + Math.sin(ang)*r, y: CHART_C.y - Math.cos(ang)*r };
}
function drawChart(){
  px(0,0,W,H,'#0f3550');
  // faint grid
  for(var x=0;x<W;x+=40) px(x,0,1,H,'#1c4f6b');
  for(var y=0;y<H;y+=40) px(0,y,W,1,'#1c4f6b');
  // reach ring
  var reach = reachOf(g);
  var rr = (reach/DMAX) * CHART_C.R;
  ctx.strokeStyle='#63d6a0'; ctx.setLineDash([5,5]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CHART_C.x, CHART_C.y, Math.max(6,rr), Math.PI, 0); ctx.stroke();
  ctx.setLineDash([]);
  // home
  px(CHART_C.x-4, CHART_C.y-4, 8, 8, '#eef4ff');
  // targets
  for(var i=0;i<g.targets.length;i++){
    var t=g.targets[i];
    if(t.done) continue;
    var p=chartPos(t.lane, t.dist);
    var within = t.dist <= reach;
    ctx.fillStyle = t.big ? (within?'#ffd34d':'#b39a55') : (within?'#bfe9ff':'#6f93ad');
    var r = t.big?7:4;
    ctx.fillRect(p.x-r, p.y-r*0.6, r*2, r*1.6);
    ctx.fillStyle = within ? '#eef4ff' : '#9fb8cc';
    ctx.font='9px ui-monospace,monospace';
    ctx.fillText(t.name, p.x-14, p.y-8);
  }
  ctx.fillStyle='#eef4ff'; ctx.font='12px ui-monospace,monospace';
  ctx.fillText('CHART  reach '+Math.round(reach)+'u', 14, 24);
  ctx.fillStyle='#cfe4f2'; ctx.font='10px ui-monospace,monospace';
  ctx.fillText(g.msg, 14, H-12);
  ctx.fillStyle='#9fb8cc';
  ctx.fillText('tap an island to set a heading', 14, H-30);
}

function ctext(s, y, col, font){
  ctx.font = font || '11px ui-monospace,monospace';
  ctx.fillStyle = col;
  ctx.fillText(s, Math.round(W/2 - ctx.measureText(s).width/2), y);
}
function drawOver(){
  px(0,0,W,H,'#123a52'); drawSea();
  ctext(g.won?'YOU MADE THE BIG LAND':'THE SEA WON', H*0.40, g.won?'#c8ffd8':'#ffb0a0','16px ui-monospace,monospace');
  ctext(g.msg, H*0.48, '#eef4ff');
  ctext('legs made: '+g.legs+'   raft left: '+Math.round(g.integrity), H*0.54, '#eef4ff');
  ctext('tap or press ENTER to sail again', H*0.62, '#cfe4f2');
}

function render(){
  if(g.scene==='chart') drawChart();
  else if(g.scene==='sail') drawSail();
  else drawOver();
}

function step(t){
  if(!last) last=t;
  var dt = Math.min(0.05, (t-last)/1000);
  last=t;
  tickChart(g, dt);
  tickSail(g, dt);
  render();
  requestAnimationFrame(step);
}

function evPos(e){
  var r = cv.getBoundingClientRect();
  var cxp = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var cyp = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  return { x: (cxp - r.left) * (W/r.width), y: (cyp - r.top) * (H/r.height) };
}
var dragStart = null, dragMoved = 0;

function onDown(e){
  e.preventDefault();
  var p = evPos(e);
  dragStart = p; dragMoved = 0;
  if(g.scene==='sail') g.dragging = true;
}
function onMove(e){
  if(!dragStart) return;
  e.preventDefault();
  var p = evPos(e);
  var dx = p.x - dragStart.x;
  dragMoved = Math.max(dragMoved, Math.abs(dx) + Math.abs(p.y - dragStart.y));
  if(g.scene==='sail' && Math.abs(dx) > 2){
    g.heading = clamp(g.heading + dx*(1.6/W), -1, 1);
    dragStart.x = p.x;
  }
}
function pickChart(p){
  for(var i=0;i<g.targets.length;i++){
    var t=g.targets[i];
    if(t.done) continue;
    var c=chartPos(t.lane, t.dist);
    if(Math.abs(p.x-c.x) < 22 && Math.abs(p.y-c.y) < 20){ chooseTarget(g, i); return true; }
  }
  return false;
}
function onUp(e){
  if(!dragStart) return;
  var p = dragStart; var moved = dragMoved;
  dragStart = null; g.dragging = false; g.steer = 0;
  if(g.ended){ g = newGame((Date.now()&0xffff)); return; }
  if(moved > 16) return;
  if(g.scene==='chart'){ pickChart(p); return; }
  if(g.scene==='sail'){
    if(canLand(g)){ doLandfall(g); return; }
    var t=g.targets[g.target];
    if(t && t.dist<=LAND_RANGE) g.msg = Math.abs(t.lane-g.heading)<0.30 ? 'tap to go ashore' : 'line her up with the island';
    return;
  }
}
function hit(p, b){ return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }

cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchmove', onMove, {passive:false});
cv.addEventListener('touchend', onUp, {passive:false});
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', onMove);
cv.addEventListener('mouseup', onUp);

window.addEventListener('keydown', (e) => {
  KEYS[e.key]=true;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') g.steer = -1;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') g.steer = 1;
  if(e.key==='Enter'&&g.ended){ g=newGame((Date.now()&0xffff)); }
});
window.addEventListener('keyup', (e) => {
  KEYS[e.key]=false;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='ArrowRight'||e.key==='d'||e.key==='D') g.steer = 0;
});

window.__game = {
  state: () => g,
  reset: (seed) => { g = newGame(seed===undefined?999:seed); return g; },
  scene: () => g.scene,
  reach: () => reachOf(g),
  targets: () => g.targets,
  choose: (i) => chooseTarget(g, i),
  tick: (dt) => { tickSail(g, dt); return g; },
  steer: (v) => { g.steer = v; return g; },
  heading: () => g.heading,
  rifts: () => g.rifts,
  planRifts: (d) => planRifts(g, d),
  canLand: () => canLand(g),
  land: () => doLandfall(g),
  integrity: () => g.integrity,
  chartPos: (l,d) => chartPos(l,d),
  pickChart: (x,y) => pickChart({x:x,y:y})
};

requestAnimationFrame(step);
</script>
